<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="吃什么">
<meta name="theme-color" content="#ffcf4d">
<title>吃什么</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
/* 老人优先：浅底深字、超大字、大按钮；妈妈只做三件事：看、点一下、打钩 */
:root{--bg:#fff8e7;--paper:#fff;--fg:#1f1b17;--muted:#6f655a;--line:#eadcb8;--accent:#ffcf4d;--accent-deep:#f0b000;--pick:#ff8c00;--pick-soft:#fff0d2;--good:#1b7a2a;--good-soft:#e3f5e4;--bad:#c62828;--bad-soft:#ffe3e3;--soft:#ffe9a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:20px;line-height:1.3}
body{padding:env(safe-area-inset-top) max(14px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));max-width:720px;margin:0 auto;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
header{text-align:center;padding:10px 0 2px;position:relative}
#btnProfile{position:absolute;right:0;top:8px;width:58px;height:58px;border-radius:50%;border:3px solid var(--accent-deep);background:var(--paper);padding:0;overflow:hidden;font-size:32px;display:flex;align-items:center;justify-content:center}
#btnProfile .av{width:100%;height:100%;background:none}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;background:var(--soft);position:relative;flex-shrink:0;width:1.7em;height:1.7em;vertical-align:middle;line-height:1}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.xl{width:120px;height:120px;font-size:70px;border:4px solid var(--accent-deep)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{font-size:26px;margin:0 0 8px}
.sheet .who-row{display:flex;gap:8px}
.sheet .who-row button{flex:1;min-width:0;font-size:20px;font-weight:700;padding:12px 4px;border-radius:18px;border:3px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;gap:6px}
.sheet .who-row button.on{border-color:var(--accent-deep);background:var(--accent)}
.sheet .who-row .av{width:56px;height:56px;font-size:34px}
.big-btn.sm{width:auto;display:inline-block;padding:8px 14px;font-size:19px;flex:none}
.hrow{padding:12px 0;border-top:2px solid var(--line)}
.hrow:first-child{border-top:none;padding-top:0}
.hrow .hl{font-size:24px;font-weight:800;margin-bottom:8px}
.hrow .hl small{font-size:18px;color:var(--muted);font-weight:400}
.home-row.three{gap:8px}
.home-row.three button{font-size:21px;padding:14px 2px;border-width:3px}
.home-row button.on.maybe{background:var(--soft);border-color:var(--accent-deep)}
.sg{margin:0 0 10px}
.sg .sgl{display:block;font-size:18px;color:var(--muted);font-weight:700;margin:0 0 6px}
.hb{color:#b3261e;font-weight:800;white-space:nowrap}
.wish .n small{display:block;font-size:17px;color:var(--muted);font-weight:400}
.wish .x.go{border-color:var(--accent-deep);background:var(--accent);color:var(--fg);font-weight:700;font-size:20px;padding:10px 14px}
.wish .x.red{border-color:#b3261e;color:#b3261e;font-weight:700}
button.secfold{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;border:none;background:none;padding:8px 0;margin:14px 0 4px;font-size:24px;font-weight:800;color:var(--fg)}
button.secfold small{font-size:18px;color:var(--muted);font-weight:400}
button.secfold .arr{font-size:18px;color:var(--muted);width:20px}
header h1{font-size:34px;margin:0}
header p{font-size:19px;color:var(--muted);margin:2px 0 0;min-height:1.3em}
nav{display:flex;gap:10px;position:sticky;top:env(safe-area-inset-top);background:var(--bg);z-index:5;padding:10px 0}
nav button{flex:1;min-width:0;font-size:1.35em;font-weight:700;padding:16px 4px;border:3px solid var(--accent-deep);border-radius:18px;background:var(--paper)}
nav button.active{background:var(--accent)}
nav button{position:relative}
nav .badge{position:absolute;top:-8px;right:-6px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--bad);color:#fff;font-size:16px;line-height:26px;text-align:center}
.view{display:none;padding-top:6px}.view.active{display:block}
.hint{font-size:21px;color:var(--muted);text-align:center;margin:6px 0 12px}
.note{font-size:19px;color:var(--muted);text-align:center;margin:8px 0;min-height:1.3em}
h2.sec{font-size:26px;margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
h2.sec small{font-size:18px;color:var(--muted);font-weight:400}
h3.sec{font-size:22px;color:var(--muted);margin:18px 0 8px}
.box{background:var(--paper);border:4px solid var(--line);border-radius:24px;padding:14px;margin-bottom:14px}
.box h3{font-size:22px;margin:0 0 10px;color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}
.big-btn{font-size:26px;font-weight:700;padding:18px 16px;border-radius:20px;border:3px solid var(--accent-deep);background:var(--paper);flex:1;min-width:0}
.big-btn.primary{background:var(--accent)}
.big-btn.ghost{background:var(--bg);border-color:var(--line);color:var(--muted);font-size:22px;padding:14px}
.big-btn.danger{background:var(--bad-soft);border-color:var(--bad)}
.mic{font-size:26px;padding:0 16px;border-radius:16px;border:3px solid #7cb97f;background:#e8f5e9;flex:0 0 auto}
.mic.listening{background:var(--pick-soft);border-color:var(--pick)}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0;font-size:22px;padding:14px;border-radius:16px;border:3px solid var(--line);background:var(--paper)}
.add-row .big-btn{flex:0 0 auto;font-size:22px;padding:12px 16px}
/* 图片卡片网格（早饭选择、点菜） */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{min-width:0;overflow:hidden;background:var(--paper);border:4px solid var(--line);border-radius:22px;padding:0;text-align:center;display:flex;flex-direction:column}
.card.selected{border-color:var(--pick);background:var(--pick-soft)}
.pic{position:relative;height:140px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic .emoji{font-size:76px;line-height:1}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.pic img.ok{opacity:1}
.pic .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);color:#fff;font-size:22px;font-weight:700;padding:4px 6px;display:none}
.pics.multi .pic .cap{display:block}
.card .name{font-size:26px;font-weight:700;padding:8px 6px 10px;overflow-wrap:anywhere;line-height:1.2}
.card .tick{font-size:18px;color:var(--pick);font-weight:700;padding-bottom:8px;margin-top:-4px}
.card .meta{font-size:17px;color:var(--muted);padding-bottom:8px;margin-top:-4px}
.special{display:flex;gap:12px;margin-top:16px}
#btnRandom{background:var(--accent)}
#btnSkip{background:var(--bad-soft);border-color:var(--bad)}
.status{font-size:22px;text-align:center;color:var(--good);min-height:1.4em;margin:12px 0 0;font-weight:700}
/* 早饭答案 */
.morning-card{background:var(--paper);border-radius:28px;overflow:hidden;text-align:center;margin-bottom:12px;border:4px solid var(--line)}
.morning-card .pics{display:grid;grid-template-columns:1fr}
.morning-card .pic{height:auto;aspect-ratio:4/3;max-height:40vh}
.morning-card .pic .emoji{font-size:130px}
.morning-card .pics.multi{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px}
.morning-card .pics.multi .pic{height:160px;aspect-ratio:auto;max-height:none}
.morning-card .pics.multi .pic .emoji{font-size:90px}
.morning-card .name{font-size:56px;font-weight:800;padding:16px 10px 6px;overflow-wrap:anywhere;line-height:1.1}
.morning-card .sub{font-size:24px;color:var(--muted);padding:0 12px 18px}
#btnSpeak{width:100%;background:var(--accent);font-size:30px;padding:22px;margin:0 0 14px}
/* 晚饭 */
.count{font-size:38px;font-weight:800;margin:0 0 6px}
.count small{display:block;font-size:19px;color:var(--muted);font-weight:400}
.person{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px solid var(--line);font-size:23px;flex-wrap:wrap}
.person .who{font-weight:800;min-width:84px}
.st{padding:4px 12px;border-radius:999px;font-size:19px;font-weight:700;background:var(--bg);border:2px solid var(--line)}
.st.yes{background:var(--good-soft);border-color:#2e7d32;color:#1b5e20}
.st.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.st.maybe{color:var(--muted)}
.person .pw{color:var(--muted);flex:1;min-width:120px;overflow-wrap:anywhere;font-size:20px}
.cook-card{background:var(--soft);border-radius:24px;padding:16px;text-align:center;margin-bottom:12px}
.cook-card .lab{font-size:20px;color:var(--muted)}
.cook-card .txt{font-size:46px;font-weight:800;line-height:1.15;overflow-wrap:anywhere;margin:4px 0}
.cook-card .txt.none{font-size:26px;color:var(--muted);font-weight:400}
.cook-card .for{font-size:20px;color:var(--good);font-weight:700;margin-bottom:8px}
.cook-card .tmr{font-size:20px;color:var(--muted);margin-top:10px;border-top:2px solid rgba(0,0,0,.08);padding-top:10px}
.cook-card .tmr b{color:var(--fg)}
.cook-card .tmr .dw{font-size:18px;margin-top:4px}
.cook-card .tmr .dl{font-size:22px}
.cook-card button{margin-top:8px}
.chooser{background:var(--paper);border:4px solid var(--pick);border-radius:24px;padding:14px;margin-bottom:14px}
.chooser h3{font-size:24px;margin:0 0 8px}
.chooser h4{font-size:19px;color:var(--muted);margin:14px 0 6px;font-weight:700}
.chooser .row .primary{flex-basis:100%;font-size:30px;padding:20px}
.chooser .row .danger,.chooser .row .ghost{font-size:22px;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-size:22px;padding:10px 14px;border-radius:999px;border:2px solid var(--line);background:var(--bg);display:flex;align-items:center;gap:6px;max-width:100%}
.chips button.on{background:var(--accent);border-color:var(--accent-deep)}
.chips button small{font-size:16px;color:var(--muted);font-weight:400}
.chips button.on small{color:#5a4600}
.chips.big button{font-size:26px;padding:14px 18px}
.chips button.x{border-style:dashed}
.chooser .chips button{flex-wrap:wrap;text-align:left}
.chooser .chips button .cn{overflow-wrap:anywhere}
/* 心愿单、菜谱列表 */
.home-row{display:flex;gap:12px}
.home-row button{flex:1;min-width:0;font-size:28px;font-weight:800;padding:20px 10px;border-radius:20px;border:4px solid var(--line);background:var(--bg)}
.home-row button.on.yes{background:var(--good-soft);border-color:#2e7d32}
.home-row button.on.no{background:var(--bad-soft);border-color:var(--bad)}
.wish{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:8px;font-size:22px;flex-wrap:wrap}
.wish .n{font-weight:800;flex:1;min-width:120px;overflow-wrap:anywhere}
.wish .w{color:var(--muted);font-size:19px}
.wish .x{font-size:18px;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--muted)}
.wish.done{opacity:.6}
.menu-list{list-style:none;padding:0;margin:0 0 8px}
.menu-list li{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:10px;margin-bottom:10px;min-width:0}
.menu-list .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.menu-list .thumb{width:68px;height:68px;border-radius:14px;flex-shrink:0;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;position:relative}
.menu-list .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.menu-list .thumb img.ok{opacity:1}
.menu-list .mname{flex:1;min-width:110px;font-size:25px;font-weight:700;overflow-wrap:anywhere}
.menu-list .mname small{display:block;font-size:17px;color:var(--muted);font-weight:400}
.menu-list .open{font-size:20px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);flex-shrink:0}
.detail{margin-top:12px;border-top:2px solid var(--line);padding-top:12px}
.detail .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.detail .acts button,.detail .acts label{font-size:20px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);cursor:pointer;display:inline-block}
.detail .acts .del{color:var(--bad)}
.detail .acts .del.confirm{background:var(--bad);border-color:var(--bad);color:#fff}
.detail .acts input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.detail .ing{margin:6px 0 10px}
.ingchip{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg);max-width:100%}
.ingchip .nm{font-size:22px;padding:10px 6px 10px 14px}
.ingchip button.buy{border:none;border-left:2px solid var(--line);background:var(--paper);font-size:20px;font-weight:700;padding:10px 14px;color:var(--accent-deep)}
.ingchip button.buy.on{background:var(--accent);color:var(--fg)}
/* 买菜 */
.chips button .tag{font-size:14px;padding:1px 6px;border-radius:999px;background:var(--pick);color:#fff;font-weight:700}
.plan-dish{border-top:2px solid var(--line);padding:10px 0}
.plan-dish:first-of-type{border-top:none;padding-top:0}
.plan-dish .t{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:24px;font-weight:800}
.plan-dish .t .fold{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;border:none;background:none;padding:6px 0;font:inherit;color:inherit}
.plan-dish .t .fold .arr{font-size:18px;color:var(--muted);flex-shrink:0;width:18px}
.plan-dish .t .fold small{font-size:16px;color:var(--muted);font-weight:400}
.plan-dish .sum{font-size:19px;color:var(--muted);margin:-2px 0 4px 26px}
.plan-dish .t button{margin-left:auto;font-size:19px;padding:8px 12px;border-radius:12px;border:2px solid var(--accent-deep);background:var(--paper);flex-shrink:0}
.shop-row{display:flex;align-items:stretch;gap:8px;margin-bottom:8px}
.shop-row .shop-item{margin:0;flex:1;min-width:0}
.shop-row .store{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0 14px;border-radius:18px;border:3px solid #2e7d32;background:var(--good-soft);color:#1b5e20;font-size:20px;font-weight:800;text-decoration:none;white-space:nowrap}
.shop-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px;font-size:26px;font-weight:700}
.shop-item .bx{width:38px;height:38px;border-radius:50%;border:3px solid var(--accent-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:24px;background:var(--bg)}
.shop-item .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.shop-item .nm small{display:block;font-size:16px;color:var(--muted);font-weight:400}
.shop-item.done{opacity:.55}
.shop-item.done .nm{text-decoration:line-through}
.shop-item.done .bx{background:var(--good-soft);border-color:#2e7d32}
.empty{background:var(--paper);border:3px dashed var(--line);border-radius:22px;padding:24px 16px;text-align:center;font-size:21px;color:var(--muted);grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f1b17;color:#fff;padding:14px 22px;border-radius:16px;font-size:22px;z-index:20;max-width:90vw;text-align:center}
.foot{text-align:center;margin-top:28px;font-size:18px;color:var(--muted)}
.foot button{background:var(--paper);border:2px solid var(--line);border-radius:16px;color:var(--muted);font-size:20px;padding:12px 18px}
#who{text-align:center;padding:30px 0}
#who h2{font-size:34px;margin:0 0 8px}
#who p{font-size:22px;color:var(--muted);margin:0 0 24px}
#who button{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;font-size:38px;font-weight:800;padding:26px 20px;border-radius:26px;border:4px solid var(--accent-deep);background:var(--paper);margin-bottom:16px}
#who button.mom{background:var(--accent)}
/* 妈妈模式：字再大一号 */
body.mom{font-size:22px}
body.mom .morning-card .name{font-size:68px}
body.mom .cook-card .txt{font-size:54px}
body.mom .chips.big button{font-size:30px;padding:18px 20px}
@media (prefers-reduced-motion:no-preference){.card:active,.big-btn:active,nav button:active{transform:scale(.97)}}
</style>
</head>
<body>
<header><h1>🍜 吃什么</h1><p id="dateLine"></p><button type="button" id="btnProfile" aria-label="我的头像、换人、提意见" hidden></button></header>

<section id="who" hidden>
  <h2>这是谁的手机？</h2>
  <p>选一次就记住了，以后不再问</p>
  <div id="whoBtns"></div>
</section>
<div id="sheet" class="sheet-bg" hidden><div class="sheet" id="sheetBody"></div></div>

<div id="app" hidden>
<nav id="nav" aria-label="页面"></nav>

<!-- 妈妈：今天 -->
<section id="view-today" class="view">
  <button type="button" id="btnSpeak" class="big-btn">🔊 读给我听</button>
  <div id="todayBody">
  <h2 class="sec" id="bfSec">早饭 <small id="bfDate"></small></h2>
  <div id="morningCard" class="morning-card"></div>
  <h2 class="sec" id="dnSec">晚饭 <small id="dnDate"></small></h2>
  <div id="dinnerBoard" class="box"></div>
  <div id="cookCard" class="cook-card"></div>
  <div id="chooser" class="chooser" hidden></div>
  </div>
  <div id="hbBox" class="box" hidden></div>
</section>

<!-- 女儿 / 小陈：点菜 -->
<section id="view-order" class="view">
  <div class="box"><h3>回来吃晚饭吗？</h3><div id="homeRows"></div><p class="note" style="text-align:left;margin:8px 0 0">当天下午 5 点还没说的，妈妈按回来吃算</p></div>
  <div class="box" id="momSaid"></div>
  <h3 class="sec">想吃什么？点一下就告诉妈妈了，不一定今天做</h3>
  <div id="orderGrid" class="grid"></div>
  <form class="add-row" id="otherForm" style="margin-top:12px">
    <input id="otherInput" placeholder="想吃别的？说一句或打字" autocomplete="off">
    <button type="button" id="btnOtherVoice" class="mic">🎤</button>
    <button type="submit" class="big-btn">点菜</button>
  </form>
  <p id="otherStatus" class="note"></p>
  <button type="button" id="btnOrderSuggest" class="big-btn ghost" style="width:100%" hidden>✨ 不知道吃啥？推荐几道新菜</button>
  <p id="orderSuggestStatus" class="note"></p>
  <div id="orderSuggest"></div>
  <h3 class="sec">心愿单 <small style="font-size:17px;font-weight:400">想鼓励妈妈就点「🧧 包红包」，红包多的排前面</small></h3>
  <div id="wishList"></div>
</section>

<!-- 女儿 / 小陈：早饭 -->
<section id="view-breakfast" class="view">
  <div id="bfAnswer" class="box" style="text-align:center"></div>
  <p class="hint" id="pickHint"></p>
  <div id="pickGrid" class="grid"></div>
  <div class="special">
    <button type="button" id="btnRandom" class="big-btn">随便</button>
    <button type="button" id="btnSkip" class="big-btn">不吃</button>
  </div>
  <p id="pickStatus" class="status"></p>
</section>

<!-- 买菜（全家） -->

// ---- 网络 ----
function api(path, opts){

}

}

// ---- 语音：后端 Qwen 录音识别 → 浏览器识别 → 键盘话筒 ----
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var inWeChat=/MicroMessenger/i.test(navigator.userAgent);

var recorder=null;
function voiceCapture(o){ // o: {btn, status, input, onText}
  if(state.voice&&canRecord) return recordAndTranscribe(o);
  if(SR&&!inWeChat) return browserRecognize(o);
  keyboardDictation(o,'');
}
function keyboardDictation(o,prefix){ if(o.input){ o.input.value=''; o.input.focus(); } o.status.textContent=(prefix||'')+'请点键盘上的 🎤 话筒键说，说完点旁边的按钮'; }
function setRec(o,on){ o.btn.classList.toggle('listening',on); o.btn.textContent=on?'⏹':'🎤'; }
function recordAndTranscribe(o){
  if(recorder){ if(recorder.state==='recording') recorder.stop(); return; }

    var types=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/aac'], mime=null;
    for(var i=0;i<types.length;i++){ if(window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(types[i])){ mime=types[i]; break; } }
    var rec; try{ rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream); }catch(e){ stream.getTracks().forEach(function(t){ t.stop(); }); keyboardDictation(o,'这个浏览器不能录音。'); return; }
    var chunks=[]; recorder=rec;
    rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onstop=function(){
      stream.getTracks().forEach(function(t){ t.stop(); }); recorder=null; setRec(o,false);
      var type=(rec.mimeType||mime||'audio/mp4').split(';')[0], blob=new Blob(chunks,{type:type});
      if(blob.size<1000){ o.status.textContent='没录到声音，再点一次，说久一点'; return; }
      o.status.textContent='正在听懂…';
      // 先在手机上转成 WAV 再传（识别服务对 WAV 最稳）；转不了或没成功，再把原录音传一次
      function send(b){ return api('/api/transcribe',{method:'POST',blob:b}); }
      blobToWav(blob).then(function(wav){ return send(wav).catch(function(e){ if(e&&e.status===422) throw e; return send(blob); }); }, function(){ return send(blob); }).then(function(r){ var t=String(r.text||'').trim(); if(!t){ o.status.textContent='没听清，请再说一次'; return; } o.status.textContent='听到：'+t; o.onText(t); })
        .catch(function(e){ o.status.textContent=(e&&e.message)||'识别失败，请再试一次'; });
    };

    setTimeout(function(){ if(recorder===rec&&rec.state==='recording') rec.stop(); },15000);
  }).catch(function(){ keyboardDictation(o,'没有麦克风权限。'); });

// 把录音解码后压成 16k 单声道 WAV
var sharedAC=null;
function blobToWav(blob){

    if(!sharedAC) sharedAC=new AC();
    return new Promise(function(res,rej){ var p=sharedAC.decodeAudioData(buf,res,rej); if(p&&p.then) p.then(res,rej); });
  }).then(function(ab){
    var n=ab.length, rate=ab.sampleRate, c0=ab.getChannelData(0), c1=ab.numberOfChannels>1?ab.getChannelData(1):null;
    var to=16000, step=rate/to, m=Math.floor(n/step); if(m<1600) throw new Error('too short');

    view.setUint32(24,to,true); view.setUint32(28,to*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true); w(36,'data'); view.setUint32(40,m*2,true);
    for(var i=0;i<m;i++){

      var a=Math.floor(i*step), b=Math.min(n,Math.max(a+1,Math.floor((i+1)*step))), sum=0;
      for(var k=a;k<b;k++) sum+= c1 ? (c0[k]+c1[k])/2 : c0[k];

// 晚饭（妈妈的今天页）
function dinnerStatus(plan, who){
  var r=plan&&plan.replies?plan.replies[who]:null, late=plan&&plan.date===today()&&new Date().getHours()>=DINNER_DEFAULT_HOUR;
  if(r&&r.home===true) return {k:'yes',t:'回来吃',s:'回来吃'};
  if(r&&r.home===false) return {k:'no',t:'不回来',s:'不回来'};
  if(late) return {k:'yes',t:(r?'没想好':'没说')+'，算回来吃',s:'算回来吃'};

}
function openWishesOf(who){ return (state.wishes||[]).filter(function(w){ return w.who===who && w.status!=='done'; }); }

function renderDinner(){
  var days=planDays(), plan=days[0], d0=plan.date, lab0=nightLabel(d0);
  $('dnDate').textContent=lab0+' · '+dateLabel(d0).replace(/^今天 |^明天 /,'');
  var n=0, lines=[];
  var rows=MEMBERS.map(function(who){

    var ws=openWishesOf(who).map(function(w){ var d=dishById(w.dishId); return d?{n:d.name,hb:w.hb||0}:null; }).filter(Boolean);
    lines.push(PEOPLE[who].name+st.t+(ws.length?'，想吃'+ws.map(function(x){ return x.n; }).join('、'):''));
    return '<div class="person"><span class="who">'+av(who)+' '+esc(PEOPLE[who].name)+'</span><span class="st '+st.k+'">'+st.t+'</span><span class="pw">'+(ws.length?'想吃 '+ws.map(function(x){ return esc(x.n)+(x.hb?' <span class="hb">'+hbText(x.hb)+'</span>':''); }).join('、'):'')+'</span></div>';
  }).join('');

  var cn=cookNames(plan);
  var forWho=[], forHb=0; if(plan.cook){ (plan.cook.dishIds||[]).forEach(function(id){ (state.wishes||[]).forEach(function(w){ if(w.dishId===id&&w.status!=='done'){ if(forWho.indexOf(PEOPLE[w.who].name)<0) forWho.push(PEOPLE[w.who].name); forHb+=w.hb||0; } }); }); }
  function materials(){
    if(!plan.cook) return '';
    var ds=(plan.cook.dishIds||[]).map(dishById).filter(Boolean), miss=[], noIng=[];

function recipeAction(a, d, el, li){
  var ing=(d.ingredients||[]).slice();

  if(a==='buy'){ var bx=el.getAttribute('data-x'), it=openItem(bx); if(it) act(api('/api/shopping',{method:'POST',json:{op:'remove',id:it.id}}),'从要买里拿掉了'); else shopAdd([bx], d.name); return; }
  if(a==='buyall'){ shopAdd(ing.filter(function(y){ return !openItem(y); }), d.name); return; }
  if(a==='ingadd'){ var v=li.querySelector('#ingInput').value; var add=parseList(v); if(!add.length) return; saveIngredients(d, ing.concat(add.filter(function(y){ return ing.indexOf(y)<0; }))); return; }

}
function shrink(file){
  return new Promise(function(res){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){ var s=Math.min(1,1200/Math.max(img.width,img.height)); var c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(function(b){ res(b||file); },'image/jpeg',0.85); };
    img.onerror=function(){ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}
function shrinkSquare(file, size){
  return new Promise(function(res){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){ var m=Math.min(img.width,img.height), c=document.createElement('canvas'); c.width=c.height=size; c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size); URL.revokeObjectURL(url); c.toBlob(function(b){ res(b||file); },'image/jpeg',0.85); };
    img.onerror=function(){ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}

    +'<h3 style="margin-top:20px">换个人用</h3><div class="who-row">'+['mom','kid','jim'].map(function(r){ return '<button type="button" data-role="'+r+'" class="'+(r===role?'on':'')+'">'+av(r)+esc(PEOPLE[r].name)+'</button>'; }).join('')+'</div>'
    +'<button type="button" class="big-btn ghost" id="sheetClose" style="width:100%;margin-top:16px">关闭</button>');
  $('avFile').onchange=function(){ var f=$('avFile').files[0]; if(!f) return; $('avStatus').textContent='正在上传…'; shrinkSquare(f,400).then(function(blob){ return api('/api/profile/'+role+'/photo',{method:'POST',blob:blob}); }).then(function(){ toast('头像换好了'); return loadState(); }).then(function(){ openProfile(); }).catch(function(e){ $('avStatus').textContent=e.message||'没传上，请再试一次'; }); };
  $('fbVoice').onclick=function(){ voiceCapture({btn:$('fbVoice'),status:$('fbStatus'),input:$('fbInput'),onText:function(t){ $('fbInput').value=($('fbInput').value?$('fbInput').value+'，':'')+t; }}); };
  $('fbSend').onclick=function(){ var t=$('fbInput').value.trim(); if(!t){ $('fbStatus').textContent='先说一句或打几个字'; return; } $('fbSend').disabled=true; api('/api/feedback',{method:'POST',json:{who:role,text:t}}).then(function(){ closeSheet(); toast('收到了，谢谢！'); }).catch(function(e){ $('fbSend').disabled=false; $('fbStatus').textContent=e.message||'没发出去，请再试一次'; }); };
  Array.prototype.forEach.call($('sheetBody').querySelectorAll('.who-row button'), function(b){ b.onclick=function(){ var r=b.getAttribute('data-role'); closeSheet(); if(r===role) return; store('bf_role', r); chooser=null; applyRole(r); toast('现在是'+PEOPLE[r].name); }; });
  $('sheetClose').onclick=closeSheet;
  if(focusFeedback) setTimeout(function(){ $('fbInput').scrollIntoView({block:'center'}); },50);
}
$('btnProfile').onclick=function(){ openProfile(false); };
$('btnFeedback').onclick=function(){ openProfile(true); };
var saved=load('bf_role');
if(PEOPLE[saved]) applyRole(saved); else { $('who').hidden=false; renderWho(); }

loadState();
setInterval(loadState, 10000);
// 网页有新版本就自己刷新一次（GitHub Pages 和手机都会缓存旧页面）
var verReloaded=false;
function checkVersion(){
  fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.text():''; }).then(function(v){
    v=(v||'').trim(); if(!v||v.length>40) return;
    var old=load('bf_ver');
    if(old===v) return;
    store('bf_ver', v);
    if(!old||verReloaded||uiBusy()) return;   // 第一次只记下来；正在打字就别刷
    verReloaded=true;
    Promise.all([fetch('index.html',{cache:'reload'}),fetch('config.js',{cache:'reload'})]).catch(function(){}).then(function(){ location.reload(); });
  }).catch(function(){});
}
checkVersion();
setInterval(checkVersion, 5*60000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) checkVersion(); });
document.addEventListener('visibilitychange', function(){ if(!document.hidden) loadState(); });
window.addEventListener('online', loadState);
setInterval(render, 60000);
})();
</script>
</body>
</html>
