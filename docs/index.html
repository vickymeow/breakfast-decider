<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="吃什么">
<meta name="theme-color" content="#ffcf4d">
<title>吃什么</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
/* 老人优先：浅底深字、超大字、大按钮；妈妈只做三件事：看、点一下、打钩 */
:root{--bg:#fff8e7;--paper:#fff;--fg:#1f1b17;--muted:#6f655a;--line:#eadcb8;--accent:#ffcf4d;--accent-deep:#f0b000;--pick:#ff8c00;--pick-soft:#fff0d2;--good:#1b7a2a;--good-soft:#e3f5e4;--bad:#c62828;--bad-soft:#ffe3e3;--soft:#ffe9a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:20px;line-height:1.3}
body{padding:env(safe-area-inset-top) max(14px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));max-width:720px;margin:0 auto;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
header{text-align:center;padding:10px 0 2px}
header h1{font-size:34px;margin:0}
header p{font-size:19px;color:var(--muted);margin:2px 0 0;min-height:1.3em}
nav{display:flex;gap:10px;position:sticky;top:env(safe-area-inset-top);background:var(--bg);z-index:5;padding:10px 0}
nav button{flex:1;min-width:0;font-size:1.35em;font-weight:700;padding:16px 4px;border:3px solid var(--accent-deep);border-radius:18px;background:var(--paper)}
nav button.active{background:var(--accent)}
.view{display:none;padding-top:6px}.view.active{display:block}
.hint{font-size:21px;color:var(--muted);text-align:center;margin:6px 0 12px}
.note{font-size:19px;color:var(--muted);text-align:center;margin:8px 0;min-height:1.3em}
h2.sec{font-size:26px;margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
h2.sec small{font-size:18px;color:var(--muted);font-weight:400}
h3.sec{font-size:22px;color:var(--muted);margin:18px 0 8px}
.box{background:var(--paper);border:4px solid var(--line);border-radius:24px;padding:14px;margin-bottom:14px}
.box h3{font-size:22px;margin:0 0 10px;color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}
.big-btn{font-size:26px;font-weight:700;padding:18px 16px;border-radius:20px;border:3px solid var(--accent-deep);background:var(--paper);flex:1;min-width:0}
.big-btn.primary{background:var(--accent)}
.big-btn.ghost{background:var(--bg);border-color:var(--line);color:var(--muted);font-size:22px;padding:14px}
.big-btn.danger{background:var(--bad-soft);border-color:var(--bad)}
.mic{font-size:26px;padding:0 16px;border-radius:16px;border:3px solid #7cb97f;background:#e8f5e9;flex:0 0 auto}
.mic.listening{background:var(--pick-soft);border-color:var(--pick)}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0;font-size:22px;padding:14px;border-radius:16px;border:3px solid var(--line);background:var(--paper)}
.add-row .big-btn{flex:0 0 auto;font-size:22px;padding:12px 16px}
/* 图片卡片网格（早饭选择、点菜） */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{min-width:0;overflow:hidden;background:var(--paper);border:4px solid var(--line);border-radius:22px;padding:0;text-align:center;display:flex;flex-direction:column}
.card.selected{border-color:var(--pick);background:var(--pick-soft)}
.pic{position:relative;height:140px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic .emoji{font-size:76px;line-height:1}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.pic img.ok{opacity:1}
.pic .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);color:#fff;font-size:22px;font-weight:700;padding:4px 6px;display:none}
.pics.multi .pic .cap{display:block}
.card .name{font-size:26px;font-weight:700;padding:8px 6px 10px;overflow-wrap:anywhere;line-height:1.2}
.card .tick{font-size:18px;color:var(--pick);font-weight:700;padding-bottom:8px;margin-top:-4px}
.card .meta{font-size:17px;color:var(--muted);padding-bottom:8px;margin-top:-4px}
.special{display:flex;gap:12px;margin-top:16px}
#btnRandom{background:var(--accent)}
#btnSkip{background:var(--bad-soft);border-color:var(--bad)}
.status{font-size:22px;text-align:center;color:var(--good);min-height:1.4em;margin:12px 0 0;font-weight:700}
/* 早饭答案 */
.morning-card{background:var(--paper);border-radius:28px;overflow:hidden;text-align:center;margin-bottom:12px;border:4px solid var(--line)}
.morning-card .pics{display:grid;grid-template-columns:1fr}
.morning-card .pic{height:auto;aspect-ratio:4/3;max-height:40vh}
.morning-card .pic .emoji{font-size:130px}
.morning-card .pics.multi{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px}
.morning-card .pics.multi .pic{height:160px;aspect-ratio:auto;max-height:none}
.morning-card .pics.multi .pic .emoji{font-size:90px}
.morning-card .name{font-size:56px;font-weight:800;padding:16px 10px 6px;overflow-wrap:anywhere;line-height:1.1}
.morning-card .sub{font-size:24px;color:var(--muted);padding:0 12px 18px}
#btnSpeak{width:100%;background:var(--accent);font-size:30px;padding:22px}
/* 晚饭 */
.count{font-size:38px;font-weight:800;margin:0 0 6px}
.count small{display:block;font-size:19px;color:var(--muted);font-weight:400}
.person{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px solid var(--line);font-size:23px;flex-wrap:wrap}
.person .who{font-weight:800;min-width:84px}
.st{padding:4px 12px;border-radius:999px;font-size:19px;font-weight:700;background:var(--bg);border:2px solid var(--line)}
.st.yes{background:var(--good-soft);border-color:#2e7d32;color:#1b5e20}
.st.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.st.maybe{color:var(--muted)}
.person .pw{color:var(--muted);flex:1;min-width:120px;overflow-wrap:anywhere;font-size:20px}
.cook-card{background:var(--soft);border-radius:24px;padding:16px;text-align:center;margin-bottom:12px}
.cook-card .lab{font-size:20px;color:var(--muted)}
.cook-card .txt{font-size:46px;font-weight:800;line-height:1.15;overflow-wrap:anywhere;margin:4px 0}
.cook-card .txt.none{font-size:26px;color:var(--muted);font-weight:400}
.cook-card .for{font-size:20px;color:var(--good);font-weight:700;margin-bottom:8px}
.cook-card .tmr{font-size:20px;color:var(--muted);margin-top:10px;border-top:2px solid rgba(0,0,0,.08);padding-top:10px}
.cook-card .tmr b{color:var(--fg)}
.cook-card button{margin-top:8px}
.chooser{background:var(--paper);border:4px solid var(--pick);border-radius:24px;padding:14px;margin-bottom:14px}
.chooser h3{font-size:24px;margin:0 0 8px}
.chooser h4{font-size:19px;color:var(--muted);margin:14px 0 6px;font-weight:700}
.chooser .row .primary{flex-basis:100%;font-size:30px;padding:20px}
.chooser .row .danger,.chooser .row .ghost{font-size:22px;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-size:22px;padding:10px 14px;border-radius:999px;border:2px solid var(--line);background:var(--bg);display:flex;align-items:center;gap:6px;max-width:100%}
.chips button.on{background:var(--accent);border-color:var(--accent-deep)}
.chips button small{font-size:16px;color:var(--muted);font-weight:400}
.chips button.on small{color:#5a4600}
.chips.big button{font-size:26px;padding:14px 18px}
.chips button.x{border-style:dashed}
/* 心愿单、菜谱列表 */
.home-row{display:flex;gap:12px}
.home-row button{flex:1;min-width:0;font-size:28px;font-weight:800;padding:20px 10px;border-radius:20px;border:4px solid var(--line);background:var(--bg)}
.home-row button.on.yes{background:var(--good-soft);border-color:#2e7d32}
.home-row button.on.no{background:var(--bad-soft);border-color:var(--bad)}
.wish{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:8px;font-size:22px;flex-wrap:wrap}
.wish .n{font-weight:800;flex:1;min-width:120px;overflow-wrap:anywhere}
.wish .w{color:var(--muted);font-size:19px}
.wish .x{font-size:18px;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--muted)}
.wish.done{opacity:.6}
.menu-list{list-style:none;padding:0;margin:0 0 8px}
.menu-list li{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:10px;margin-bottom:10px;min-width:0}
.menu-list .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.menu-list .thumb{width:68px;height:68px;border-radius:14px;flex-shrink:0;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;position:relative}
.menu-list .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.menu-list .thumb img.ok{opacity:1}
.menu-list .mname{flex:1;min-width:110px;font-size:25px;font-weight:700;overflow-wrap:anywhere}
.menu-list .mname small{display:block;font-size:17px;color:var(--muted);font-weight:400}
.menu-list .open{font-size:20px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);flex-shrink:0}
.detail{margin-top:12px;border-top:2px solid var(--line);padding-top:12px}
.detail .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.detail .acts button,.detail .acts label{font-size:20px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);cursor:pointer;display:inline-block}
.detail .acts .del{color:var(--bad)}
.detail .acts .del.confirm{background:var(--bad);border-color:var(--bad);color:#fff}
.detail .acts input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.detail .ing{margin:6px 0 10px}
.ingchip{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg);max-width:100%}
.ingchip .nm{font-size:22px;padding:10px 6px 10px 14px}
.ingchip button.buy{border:none;border-left:2px solid var(--line);background:var(--paper);font-size:20px;font-weight:700;padding:10px 14px;color:var(--accent-deep)}
.ingchip button.buy.on{background:var(--accent);color:var(--fg)}
/* 买菜 */
.chips button .tag{font-size:14px;padding:1px 6px;border-radius:999px;background:var(--pick);color:#fff;font-weight:700}
.plan-dish{border-top:2px solid var(--line);padding:10px 0}
.plan-dish:first-of-type{border-top:none;padding-top:0}
.plan-dish .t{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:24px;font-weight:800}
.plan-dish .t button{margin-left:auto;font-size:19px;padding:8px 12px;border-radius:12px;border:2px solid var(--accent-deep);background:var(--paper);flex-shrink:0}
.shop-row{display:flex;align-items:stretch;gap:8px;margin-bottom:8px}
.shop-row .shop-item{margin:0;flex:1;min-width:0}
.shop-row .store{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0 14px;border-radius:18px;border:3px solid #2e7d32;background:var(--good-soft);color:#1b5e20;font-size:20px;font-weight:800;text-decoration:none;white-space:nowrap}
.shop-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px;font-size:26px;font-weight:700}
.shop-item .bx{width:38px;height:38px;border-radius:50%;border:3px solid var(--accent-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:24px;background:var(--bg)}
.shop-item .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.shop-item .nm small{display:block;font-size:16px;color:var(--muted);font-weight:400}
.shop-item.done{opacity:.55}
.shop-item.done .nm{text-decoration:line-through}
.shop-item.done .bx{background:var(--good-soft);border-color:#2e7d32}
.empty{background:var(--paper);border:3px dashed var(--line);border-radius:22px;padding:24px 16px;text-align:center;font-size:21px;color:var(--muted);grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f1b17;color:#fff;padding:14px 22px;border-radius:16px;font-size:22px;z-index:20;max-width:90vw;text-align:center}
.foot{text-align:center;margin-top:28px;font-size:18px;color:var(--muted)}
.foot button{background:none;border:none;text-decoration:underline;color:var(--muted);font-size:18px;padding:8px}
#who{text-align:center;padding:30px 0}
#who h2{font-size:34px;margin:0 0 8px}
#who p{font-size:22px;color:var(--muted);margin:0 0 24px}
#who button{display:block;width:100%;font-size:38px;font-weight:800;padding:30px 20px;border-radius:26px;border:4px solid var(--accent-deep);background:var(--paper);margin-bottom:16px}
#who button.mom{background:var(--accent)}
/* 妈妈模式：字再大一号 */
body.mom{font-size:22px}
body.mom .morning-card .name{font-size:68px}
body.mom .cook-card .txt{font-size:54px}
body.mom .chips.big button{font-size:30px;padding:18px 20px}
@media (prefers-reduced-motion:no-preference){.card:active,.big-btn:active,nav button:active{transform:scale(.97)}}
</style>
</head>
<body>
<header><h1>🍜 吃什么</h1><p id="dateLine"></p></header>

<section id="who" hidden>
  <h2>这是谁的手机？</h2>
  <p>选一次就记住了，以后不再问</p>
  <button type="button" class="mom" data-role="mom">👩 我是妈妈</button>
  <button type="button" data-role="kid">👧 我是女儿</button>
  <button type="button" data-role="jim">👨 我是小陈</button>
</section>

<div id="app" hidden>
<nav id="nav" aria-label="页面"></nav>

<!-- 妈妈：今天 -->
<section id="view-today" class="view">
  <h2 class="sec">早饭 <small id="bfDate"></small></h2>
  <div id="morningCard" class="morning-card"></div>
  <button type="button" id="btnSpeak" class="big-btn">🔊 读给我听</button>
  <h2 class="sec">晚饭 <small id="dnDate"></small></h2>
  <div id="dinnerBoard" class="box"></div>
  <div id="cookCard" class="cook-card"></div>
  <div id="chooser" class="chooser" hidden></div>
  <button type="button" id="btnSpeakDinner" class="big-btn ghost" style="width:100%">🔊 读一下晚饭情况</button>
</section>

<!-- 女儿 / 小陈：点菜 -->
<section id="view-order" class="view">
  <p class="hint" id="orderHint"></p>
  <div class="box"><h3 id="homeTitle">今晚回来吃吗？</h3><div class="home-row" id="homeRow"></div></div>
  <div class="box" id="momSaid"></div>
  <h3 class="sec">想吃什么？点一下就告诉妈妈了，不一定今天做</h3>
  <div id="orderGrid" class="grid"></div>
  <form class="add-row" id="otherForm" style="margin-top:12px">
    <input id="otherInput" placeholder="想吃别的？说一句或打字" autocomplete="off">
    <button type="button" id="btnOtherVoice" class="mic">🎤</button>
    <button type="submit" class="big-btn">点菜</button>
  </form>
  <p id="otherStatus" class="note"></p>
  <h3 class="sec">心愿单</h3>
  <div id="wishList"></div>
</section>

<!-- 女儿 / 小陈：早饭 -->
<section id="view-breakfast" class="view">
  <div id="bfAnswer" class="box" style="text-align:center"></div>
  <p class="hint" id="pickHint"></p>
  <div id="pickGrid" class="grid"></div>
  <div class="special">
    <button type="button" id="btnRandom" class="big-btn">随便</button>
    <button type="button" id="btnSkip" class="big-btn">不吃</button>
  </div>
  <p id="pickStatus" class="status"></p>
</section>

<!-- 买菜（全家） -->
<section id="view-shop" class="view">
  <h2 class="sec" style="margin-top:6px">要买的东西 <small id="shopCount"></small></h2>
  <form class="add-row" id="shopForm">
    <input id="shopInput" placeholder="要买什么？按 🎤 说一句" autocomplete="off">
    <button type="button" id="btnShopVoice" class="mic">🎤</button>
    <button type="submit" class="big-btn">加</button>
  </form>
  <p id="shopStatus" class="note"></p>
  <div class="chips" id="frequentChips" style="margin-bottom:12px"></div>
  <div id="shopList"></div>
  <button type="button" id="btnClearDone" class="big-btn primary" style="width:100%" hidden>✅ 已下单，清空买菜篮</button>
  <h2 class="sec" id="shopSecTitle" hidden>按菜加 <small>点一道菜，再点它的食材</small></h2>
  <div class="chips" id="dishChips"></div>
  <div id="planBox" class="box" hidden style="margin-top:10px"></div>
</section>

<!-- 菜谱（全家） -->
<section id="view-recipes" class="view">
  <p class="hint">说一道菜的名字就能加进去；食材也可以说</p>
  <form class="add-row" id="addForm">
    <input id="newDishName" placeholder="菜名，说一句或打字" autocomplete="off">
    <button type="button" id="btnDishVoice" class="mic">🎤</button>
    <button type="submit" class="big-btn">加</button>
  </form>
  <div class="chips" id="newCat" style="margin-top:8px">
    <button type="button" data-cat="dinner" class="on">正餐</button>
    <button type="button" data-cat="breakfast">早饭</button>
  </div>
  <p id="recipeStatus" class="note"></p>
  <h3 class="sec">正餐</h3>
  <ul id="listDinner" class="menu-list"></ul>
  <h3 class="sec">早饭</h3>
  <ul id="listBreakfast" class="menu-list"></ul>
</section>

<p id="syncNote" class="note"></p>
<p class="foot"><span id="roleLine"></span> <button type="button" id="btnSwitchRole">换个人</button></p>
</div>

<script src="config.js"></script>
<script>
(function(){
'use strict';
var BASE = String(window.BREAKFAST_API || '').replace(/\/+$/, '');
var FALLBACK_NAME = '鸡蛋三明治', FALLBACK_EMOJI = '🥪';
var PEOPLE = { mom:{name:'妈妈',emoji:'👩'}, kid:{name:'女儿',emoji:'👧'}, jim:{name:'小陈',emoji:'👨'} };
var MEMBERS = ['kid','jim'];
var DINNER_DEFAULT_HOUR = 17, DINNER_ROLL_HOUR = 20;
var NAV = { mom:['today','shop','recipes'], kid:['order','breakfast','shop','recipes'], jim:['order','breakfast','shop','recipes'] };
var VIEW_NAMES = { today:'吃啥', order:'点菜', breakfast:'早饭', shop:'买菜', recipes:'菜单' };
var VIEWS = ['today','order','breakfast','shop','recipes'];

var state = { dishes:[], pick:null, pickDate:null, wishes:[], plans:{}, shopping:[], frequent:[], voice:false, ai:false, autoPickHour:6 };
var loaded=false, role=null, lastOk=0;
var pendingDelete=null, expandedId=null, chooser=null, newCat='dinner';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var toastTimer;
function toast(msg){ var t=document.querySelector('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t);} t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.hidden=true; },2600); }
function store(k,v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){} }
function load(k){ try{ return localStorage.getItem(k);}catch(e){ return null; } }
function pad(n){ return (n<10?'0':'')+n; }
function localDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return localDate(new Date()); }
function addDays(ds,n){ var p=ds.split('-').map(Number); var d=new Date(p[0],p[1]-1,p[2]); d.setDate(d.getDate()+n); return localDate(d); }
function targetDate(){ var now=new Date(); return now.getHours()>=15 ? addDays(today(),1) : today(); }
function dinnerDate(){ var now=new Date(); return now.getHours()>=DINNER_ROLL_HOUR ? addDays(today(),1) : today(); }
function dateLabel(ds){
  var p=ds.split('-').map(Number), dd=new Date(p[0],p[1]-1,p[2]), w='日一二三四五六';
  var base=p[1]+'月'+p[2]+'日 周'+w[dd.getDay()];
  if(ds===today()) return '今天 '+base; if(ds===addDays(today(),1)) return '明天 '+base; return base;
}
function weekday(ds){ var p=ds.split('-').map(Number); return '周'+'日一二三四五六'[new Date(p[0],p[1]-1,p[2]).getDay()]; }
function daysSince(iso){ return Math.max(0, Math.floor((Date.now()-new Date(iso).getTime())/86400000)); }
function dishById(id){ var l=state.dishes||[]; for(var i=0;i<l.length;i++) if(l[i].id===id) return l[i]; return null; }
function dishesOf(cat){ return (state.dishes||[]).filter(function(d){ return d.cat===cat; }); }
function pickedIds(cur){ if(!cur||cur.type==='skip') return []; if(cur.dishes&&cur.dishes.length) return cur.dishes.slice(); return cur.dish!=null?[cur.dish]:[]; }
function pickIsCurrent(){ return state.pick && state.pickDate===targetDate(); }
function picHtml(d, cap){
  var em='<span class="emoji" aria-hidden="true">'+esc(d.emoji||'🍽️')+'</span>';
  var img=d.image?'<img src="'+esc(d.image)+'" alt="" loading="lazy" onload="this.className=\'ok\'" onerror="this.remove()">':'';
  return '<div class="pic">'+em+img+(cap?'<span class="cap">'+esc(d.name)+'</span>':'')+'</div>';
}
function parseList(text){
  return String(text||'').replace(/(需要|食材|要买|买|然后|就是|还有|以及|加上|跟|和)/g,'、').split(/[、，,。；;．\s\/]+/)
    .map(function(x){ return x.trim(); }).filter(function(x,i,a){ return x && x.length<=12 && a.indexOf(x)===i; });
}
function cleanName(t){ return String(t||'').replace(/[。，,.!！?？、\s]+/g,'').replace(/^(加|加上|加一个|加个|我要|来个|来一个|想吃|吃)/,'').trim().slice(0,30); }

// ---- 网络 ----
function api(path, opts){
  opts=opts||{}; var o={method:opts.method||'GET',headers:{}};
  if(opts.json){ o.headers['Content-Type']='application/json'; o.body=JSON.stringify(opts.json); }
  if(opts.blob){ o.headers['Content-Type']=opts.blob.type||'image/jpeg'; o.body=opts.blob; }
  if(!BASE) return Promise.reject(new Error('还没配置接口地址（docs/config.js）'));
  return fetch(BASE+path,o).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok) throw new Error(j.error||('出错了 '+r.status)); return j; }); });
}
function loadState(){
  var now=new Date();
  return api('/api/state?date='+today()+'&hour='+now.getHours()+'&ddate='+dinnerDate()).then(function(s){ state=s; loaded=true; lastOk=Date.now(); $('syncNote').textContent=''; render(); })
    .catch(function(){ if(!loaded) $('syncNote').textContent='连不上网，正在重试…'; else if(Date.now()-lastOk>60000) $('syncNote').textContent='网络不太好，显示的可能不是最新的'; render(); });
}
function act(p, okMsg){ return p.then(function(r){ if(okMsg) toast(okMsg); return loadState().then(function(){ return r; }); }).catch(function(e){ toast(e.message||'没成功，请再试一次'); }); }

// ---- 语音：后端 Qwen 录音识别 → 浏览器识别 → 键盘话筒 ----
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var inWeChat=/MicroMessenger/i.test(navigator.userAgent);
var canRecord=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
var recorder=null;
function voiceCapture(o){ // o: {btn, status, input, onText}
  if(state.voice&&canRecord) return recordAndTranscribe(o);
  if(SR&&!inWeChat) return browserRecognize(o);
  keyboardDictation(o,'');
}
function keyboardDictation(o,prefix){ if(o.input){ o.input.value=''; o.input.focus(); } o.status.textContent=(prefix||'')+'请点键盘上的 🎤 话筒键说，说完点旁边的按钮'; }
function setRec(o,on){ o.btn.classList.toggle('listening',on); o.btn.textContent=on?'⏹':'🎤'; }
function recordAndTranscribe(o){
  if(recorder){ if(recorder.state==='recording') recorder.stop(); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var types=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/aac'], mime=null;
    for(var i=0;i<types.length;i++){ if(window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(types[i])){ mime=types[i]; break; } }
    var rec; try{ rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream); }catch(e){ stream.getTracks().forEach(function(t){ t.stop(); }); keyboardDictation(o,'这个浏览器不能录音。'); return; }
    var chunks=[]; recorder=rec;
    rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onstop=function(){
      stream.getTracks().forEach(function(t){ t.stop(); }); recorder=null; setRec(o,false);
      var type=(rec.mimeType||mime||'audio/mp4').split(';')[0], blob=new Blob(chunks,{type:type});
      if(blob.size<1000){ o.status.textContent='没录到声音，再点一次，说久一点'; return; }
      o.status.textContent='正在听懂…';
      api('/api/transcribe',{method:'POST',blob:blob}).then(function(r){ var t=String(r.text||'').trim(); if(!t){ o.status.textContent='没听清，请再说一次'; return; } o.status.textContent='听到：'+t; o.onText(t); })
        .catch(function(e){ o.status.textContent=(e&&e.message)||'识别失败，请再试一次'; });
    };
    rec.start(); setRec(o,true); o.status.textContent='正在听…说完再点一下 ⏹';
    setTimeout(function(){ if(recorder===rec&&rec.state==='recording') rec.stop(); },15000);
  }).catch(function(){ keyboardDictation(o,'没有麦克风权限。'); });
}
function browserRecognize(o){
  var r; try{ r=new SR(); }catch(e){ keyboardDictation(o,''); return; }
  r.lang='zh-CN'; r.interimResults=true; r.maxAlternatives=1; r.continuous=false;
  var heard='', failed=false;
  o.status.textContent='请说…'; o.btn.classList.add('listening');
  r.onresult=function(e){ var t=''; for(var i=0;i<e.results.length;i++) t+=e.results[i][0].transcript; if(t){ heard=t; o.status.textContent='听到：'+t; } };
  r.onerror=function(e){ failed=true; o.btn.classList.remove('listening'); if(e.error==='no-speech'){ o.status.textContent='没听到声音，再点一次'; return; } keyboardDictation(o, e.error==='not-allowed'?'没有麦克风权限。':'这个浏览器不能直接听。'); };
  r.onend=function(){ o.btn.classList.remove('listening'); if(failed) return; if(!heard.trim()){ o.status.textContent='没听清，请再说一次'; return; } o.onText(heard.trim()); };
  try{ r.start(); }catch(e){ o.btn.classList.remove('listening'); keyboardDictation(o,''); }
}
function speak(text, noteEl){
  if(!('speechSynthesis' in window)){ if(noteEl) noteEl.textContent='这个手机不能朗读'; return; }
  var u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=0.85;
  var vs=speechSynthesis.getVoices(); for(var i=0;i<vs.length;i++){ if(/^zh/i.test(vs[i].lang)){ u.voice=vs[i]; break; } }
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

  if(r&&r.home===false) return {k:'no',t:'不回来'};
  if(isToday&&now.getHours()>=DINNER_DEFAULT_HOUR) return {k:'yes',t:'没说，算回来吃'};

  var m=morningHtml();
  $('bfAnswer').innerHTML='<div style="font-size:19px;color:var(--muted)">'+(td===today()?'今早':'明早')+'早饭</div><div style="font-size:34px;font-weight:800">'+esc(m.name)+'</div>';
  $('pickHint').textContent='点图片选'+(td===today()?'今早':'明早')+'的早饭，可以选几样，再点一下取消。早上 '+(state.autoPickHour||6)+' 点还没选就自动随机';
  var grid=$('pickGrid');
  if(!loaded) grid.innerHTML='<div class="empty">正在打开…</div>';
  else if(!list.length) grid.innerHTML='<div class="empty">菜单里还没有早饭，到「菜单」加</div>';
  else { var selIds=pickedIds(cur); grid.innerHTML=list.map(function(d){ var sel=selIds.indexOf(d.id)>=0; return '<button type="button" class="card'+(sel?' selected':'')+'" data-id="'+d.id+'" aria-pressed="'+(sel?'true':'false')+'">'+picHtml(d)+'<div class="name">'+esc(d.name)+'</div>'+(sel?'<div class="tick">✓ 就吃这个</div>':'')+'</button>'; }).join(''); }
  Array.prototype.forEach.call(grid.querySelectorAll('.card'), function(el){ el.onclick=function(){ var ids=pickedIds(cur), id=Number(el.getAttribute('data-id')), k=ids.indexOf(id); if(k>=0) ids.splice(k,1); else ids.push(id); act(api('/api/pick',{method:'POST',json:{type:'dishes',ids:ids,date:td}})).then(function(r){ if(r) toast(r.pick?'选好了：'+r.pick.resolvedName:'取消了'); }); }; });
  $('pickStatus').textContent=cur?(cur.type==='skip'?'已选好：不吃':'已选好：'+cur.resolvedName+(cur.auto?'（自动随机的）':cur.type==='random'?'（随便选的）':'')):(loaded?'还没选，不选就是'+FALLBACK_NAME:'');
  $('btnRandom').disabled=!list.length;
}
$('btnRandom').onclick=function(){ act(api('/api/pick',{method:'POST',json:{type:'random',date:targetDate()}})).then(function(r){ if(r&&r.pick) toast('随便选了：'+r.pick.resolvedName); }); };
$('btnSkip').onclick=function(){ act(api('/api/pick',{method:'POST',json:{type:'skip',date:targetDate()}}),'好，早饭不吃'); };

// 买菜（全家）
function plannedGroups(){
  var out=[], cur=pickIsCurrent()?state.pick:null;
  if(cur&&cur.type!=='skip'){ var ds=pickedIds(cur).map(dishById).filter(Boolean); if(ds.length) out.push({label:(targetDate()===today()?'今早':'明早')+'早饭', dishes:ds}); }
  var dd=dinnerDate(), p=state.plans&&state.plans.today, p2=state.plans&&state.plans.tomorrow;
  [[p, dd===today()?'今晚':'明晚'],[p2, dd===today()?'明晚':'后天晚上']].forEach(function(x){ var pl=x[0]; if(pl&&pl.cook&&pl.cook.dishIds&&pl.cook.dishIds.length){ var ds2=pl.cook.dishIds.map(dishById).filter(Boolean); if(ds2.length) out.push({label:x[1], dishes:ds2}); } });
  return out;
}
function openItem(name){ var l=state.shopping||[]; for(var i=0;i<l.length;i++) if(!l[i].done&&l[i].name===name) return l[i]; return null; }
function shopAdd(names, from){ names=names.filter(Boolean); if(!names.length) return Promise.resolve(); return act(api('/api/shopping',{method:'POST',json:{op:'add',names:names,from:from||''}}), names.length>1?'加了 '+names.length+' 样':'加了：'+names[0]); }
var shopOpen=null;   // 买菜页里展开的那道菜；null 时默认展开已定要做的
function renderShop(){
  // 妈妈：不绕「菜」，只看定了要做的菜要用什么，平铺点选；女儿小陈：可以按菜浏览
  var simple = role==='mom';
  var planned={}; plannedGroups().forEach(function(g){ g.dishes.forEach(function(d){ if(!planned[d.id]) planned[d.id]=g.label; }); });
  var title=$('shopSecTitle');
  if(simple){ title.hidden=!Object.keys(planned).length; title.innerHTML='做饭要用的 <small>点一下就进清单</small>'; $('dishChips').hidden=true; shopOpen=null; }
  else { title.hidden=false; title.innerHTML='按菜加 <small>点一道菜，再点它的食材</small>'; $('dishChips').hidden=false; }
  var wished={}; (state.wishes||[]).forEach(function(w){ if(w.status!=='done') wished[w.dishId]=true; });
  var all=(state.dishes||[]).slice().sort(function(a,b){
    var ra=planned[a.id]?0:wished[a.id]?1:(a.mom&&a.cat==='dinner')?2:3, rb=planned[b.id]?0:wished[b.id]?1:(b.mom&&b.cat==='dinner')?2:3;
    return ra-rb;
  });
  var openIds = shopOpen!=null ? [shopOpen] : Object.keys(planned).map(Number);
  var chips=$('dishChips');
  if(simple) chips.innerHTML='';
  else if(!loaded) chips.innerHTML='<p class="note">正在打开…</p>';
  else if(!all.length) chips.innerHTML='<p class="note">菜单还是空的</p>';
  else chips.innerHTML=all.map(function(d){ var on=openIds.indexOf(d.id)>=0; var tag=planned[d.id]?'<span class="tag">'+esc(planned[d.id])+'</span>':wished[d.id]?'<span class="tag" style="background:var(--good)">想吃</span>':''; return '<button type="button" data-id="'+d.id+'" class="'+(on?'on':'')+'">'+esc(d.emoji||'')+' '+esc(d.name)+tag+'</button>'; }).join('');
  Array.prototype.forEach.call(chips.querySelectorAll('button'), function(b){ b.onclick=function(){ var id=Number(b.getAttribute('data-id')); shopOpen = (shopOpen===id) ? -1 : id; renderShop(); }; });
  // 2) 展开的菜：食材可点
  var box=$('planBox'); var openDishes=openIds.map(dishById).filter(Boolean);
  box.hidden=!openDishes.length;
  box.innerHTML=openDishes.map(function(d){
    var ing=d.ingredients||[]; var missing=ing.filter(function(x){ return !openItem(x); });
    return '<div class="plan-dish" data-id="'+d.id+'"><div class="t">'+esc(d.emoji||'')+' '+esc(d.name)+(planned[d.id]?' <small style="font-size:16px;color:var(--muted);font-weight:400">'+esc(planned[d.id])+'</small>':'')+(ing.length&&missing.length?'<button type="button" data-act="all">都要买</button>':'')+'</div>'
      +(ing.length?'<div class="chips">'+ing.map(function(x){ var on=!!openItem(x); return '<button type="button" data-ing="'+esc(x)+'" class="'+(on?'on':'')+'">'+(on?'✓ ':'')+esc(x)+'</button>'; }).join('')+'</div>'
        :'<div class="note" style="text-align:left;margin:0 0 6px">还没填食材</div><div class="row"><button type="button" class="big-btn ghost" data-act="ingvoice">🎤 说食材</button>'+(state.ai?'<button type="button" class="big-btn ghost" data-act="ai">✨ AI 填</button>':'')+'</div><p class="note" data-st style="text-align:left;margin:4px 0 0"></p>')
      +'</div>'; }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.plan-dish'), function(el){
    var d=dishById(Number(el.getAttribute('data-id'))); if(!d) return;
    Array.prototype.forEach.call(el.querySelectorAll('[data-ing]'), function(b){ b.onclick=function(){ var x=b.getAttribute('data-ing'), it=openItem(x); if(it) act(api('/api/shopping',{method:'POST',json:{op:'remove',id:it.id}}),'拿掉了'); else shopAdd([x], d.name); }; });
    Array.prototype.forEach.call(el.querySelectorAll('[data-act]'), function(b){ var a=b.getAttribute('data-act'); b.onclick=function(){
      if(a==='all') shopAdd((d.ingredients||[]).filter(function(x){ return !openItem(x); }), d.name);
      else if(a==='ingvoice') voiceCapture({btn:b,status:el.querySelector('[data-st]'),input:null,onText:function(t){ var add=parseList(t); if(add.length) saveIngredients(d, add); else el.querySelector('[data-st]').textContent='没听出食材，再说一次'; }});
      else if(a==='ai'){ el.querySelector('[data-st]').textContent='AI 正在想…'; api('/api/ingredients',{method:'POST',json:{name:d.name}}).then(function(r){ if(!(r.items||[]).length){ el.querySelector('[data-st]').textContent='AI 没给出食材'; return; } return saveIngredients(d, r.items); }).catch(function(e){ el.querySelector('[data-st]').textContent=e.message||'AI 出错了'; }); }
    }; });
  });
  // 3) 清单
  var items=(state.shopping||[]).slice(), open=items.filter(function(x){ return !x.done; }), done=items.filter(function(x){ return x.done; });
  $('shopCount').textContent=loaded?(open.length?open.length+' 样':'没有要买的'):'';
  var fq=(state.frequent||[]).filter(function(n){ return !openItem(n); }).slice(0,8);
  $('frequentChips').innerHTML=fq.map(function(n){ return '<button type="button" data-n="'+esc(n)+'">＋ '+esc(n)+'</button>'; }).join('');
  Array.prototype.forEach.call($('frequentChips').querySelectorAll('button'), function(b){ b.onclick=function(){ shopAdd([b.getAttribute('data-n')]); }; });
  var store=window.STORE&&window.STORE.search?window.STORE:null;
  function row(it){
    var btn='<button type="button" class="shop-item'+(it.done?' done':'')+'" data-id="'+it.id+'"><span class="bx">'+(it.done?'✓':'')+'</span><span class="nm">'+esc(it.name)+(it.from?'<small>'+esc(it.from)+'</small>':'')+'</span></button>';
    if(!store||it.done) return btn;
    var href=store.search.replace('{q}', encodeURIComponent(it.name));
    return '<div class="shop-row">'+btn+'<a class="store" href="'+esc(href)+'" target="_blank" rel="noopener">🛒 '+esc(store.name)+'</a></div>';
  }
  $('shopList').innerHTML=(open.length||done.length)?open.map(row).join('')+(done.length?'<h3 class="sec">买到了</h3>'+done.map(row).join(''):''):(loaded?'<p class="note">清单是空的。按 🎤 说一句要买什么就行'+(simple?'':'，或者在下面点一道菜加它的食材')+'</p>':'');
  Array.prototype.forEach.call($('shopList').querySelectorAll('.shop-item'), function(b){ b.onclick=function(){ act(api('/api/shopping',{method:'POST',json:{op:'toggle',id:Number(b.getAttribute('data-id'))}})); }; });
  $('btnClearDone').hidden=!(open.length||done.length);
  $('btnClearDone').textContent = clearArmed ? '确定清空？再点一下' : '✅ 已下单，清空买菜篮';
  $('btnClearDone').classList.toggle('danger', clearArmed);
}
$('shopForm').onsubmit=function(e){ e.preventDefault(); var add=parseList($('shopInput').value); if(!add.length) return; shopAdd(add).then(function(){ $('shopInput').value=''; }); };
$('btnShopVoice').onclick=function(){ voiceCapture({btn:$('btnShopVoice'),status:$('shopStatus'),input:$('shopInput'),onText:function(t){ var add=parseList(t); if(!add.length){ $('shopStatus').textContent='没听清，请再说一次'; return; } shopAdd(add); }}); };
var clearArmed=false;
$('btnClearDone').onclick=function(){
  if(!clearArmed){ clearArmed=true; renderShop(); setTimeout(function(){ if(clearArmed){ clearArmed=false; renderShop(); } },4000); return; }
  clearArmed=false;
  // 没打钩的先全部打钩（算买到了），再把打钩的清掉
  var open=(state.shopping||[]).filter(function(x){ return !x.done; });
  var p=Promise.resolve();
  open.forEach(function(it){ p=p.then(function(){ return api('/api/shopping',{method:'POST',json:{op:'toggle',id:it.id}}); }); });
  act(p.then(function(){ return api('/api/shopping',{method:'POST',json:{op:'clear_done'}}); }),'买菜篮清空了');
};

// 菜谱（全家）
function dishRow(d, i, n){
  var open=expandedId===d.id;
  var meta=(d.ingredients&&d.ingredients.length?'食材 '+d.ingredients.length+' 样':'还没填食材')+(d.cat==='dinner'?(d.lastMade?' · 上次 '+d.lastMade.slice(5).replace('-','/'):' · 没做过')+(d.times?' · 做过 '+d.times+' 次':''):'');
  var html='<li data-id="'+d.id+'"><div class="top"><div class="thumb">'+esc(d.emoji||'🍽️')+(d.image?'<img src="'+esc(d.image)+'" alt="" onload="this.className=\'ok\'" onerror="this.remove()">':'')+'</div>'
    +'<span class="mname">'+(d.mom&&d.cat==='dinner'?'⭐ ':'')+esc(d.name)+'<small>'+esc(meta)+'</small></span>'
    +'<button type="button" class="open" data-act="toggle">'+(open?'收起':'详情')+'</button></div>';
  if(open){
    var ing=(d.ingredients||[]);
    var missing=ing.filter(function(x){ return !openItem(x); });
    html+='<div class="detail">'+(ing.length&&missing.length?'<div class="note" style="text-align:left;margin:0 0 6px"><button type="button" data-act="buyall" style="font-size:19px;padding:6px 12px;border-radius:12px;border:2px solid var(--accent-deep);background:var(--paper)">都要买</button></div>':'')
      +'<div class="chips ing">'+(ing.length?ing.map(function(x){ var on=!!openItem(x); return '<span class="ingchip"><span class="nm">'+esc(x)+'</span><button type="button" class="buy'+(on?' on':'')+'" data-act="buy" data-x="'+esc(x)+'">'+(on?'✓ 已加':'买')+'</button></span>'; }).join(''):'<span class="note" style="margin:0">还没填食材，说一句就行，比如「五花肉、冰糖、八角」</span>')+'</div>'
      +'<div class="add-row"><input id="ingInput" placeholder="说食材或打字，用顿号分开" autocomplete="off"><button type="button" class="mic" data-act="ingvoice">🎤</button><button type="button" class="big-btn" data-act="ingadd">加</button></div>'
      +'<p class="note" id="ingStatus" style="text-align:left"></p>'
      +'<div class="acts">'+(state.ai?'<button type="button" data-act="ai">✨ AI 帮我填食材</button>':'')
      +'<label>📷 照片<input type="file" accept="image/*" data-act="photo"></label>'
      +(d.cat==='dinner'?'<button type="button" data-act="mom">'+(d.mom?'⭐ 拿手菜':'☆ 设为拿手菜')+'</button>':'')
      +'<button type="button" data-act="up" '+(i===0?'disabled':'')+'>↑</button><button type="button" data-act="down" '+(i===n-1?'disabled':'')+'>↓</button>'
      +'<button type="button" class="del'+(pendingDelete===d.id?' confirm':'')+'" data-act="del">'+(pendingDelete===d.id?'确定删除？':'删除')+'</button></div></div>';
  }
  return html+'</li>';
}
function renderRecipes(){
  var dn=dishesOf('dinner'), bf=dishesOf('breakfast');
  $('listDinner').innerHTML=dn.length?dn.map(function(d,i){ return dishRow(d,i,dn.length); }).join(''):'<li class="empty" style="display:block">还没有正餐。上面说一道妈妈的拿手菜</li>';
  $('listBreakfast').innerHTML=bf.length?bf.map(function(d,i){ return dishRow(d,i,bf.length); }).join(''):'<li class="empty" style="display:block">还没有早饭</li>';
  ['listDinner','listBreakfast'].forEach(function(lid){
    Array.prototype.forEach.call($(lid).querySelectorAll('li'), function(li){
      var id=Number(li.getAttribute('data-id')), d=dishById(id); if(!d) return;
      Array.prototype.forEach.call(li.querySelectorAll('[data-act]'), function(el){
        var a=el.getAttribute('data-act');
        if(a==='photo'){ el.onchange=function(){ if(el.files[0]) uploadPhoto(id, el.files[0]); }; return; }
        el.onclick=function(){ recipeAction(a, d, el, li); };
      });
    });
  });
}
function saveIngredients(d, items){ return act(api('/api/dishes/'+d.id+'/update',{method:'POST',json:{ingredients:items}}),'食材记住了'); }
function recipeAction(a, d, el, li){
  var ing=(d.ingredients||[]).slice();
  if(a==='toggle'){ expandedId=expandedId===d.id?null:d.id; pendingDelete=null; renderRecipes(); return; }
  if(a==='rming'){ var x=el.getAttribute('data-x'); saveIngredients(d, ing.filter(function(y){ return y!==x; })); return; }
  if(a==='buy'){ var bx=el.getAttribute('data-x'), it=openItem(bx); if(it) act(api('/api/shopping',{method:'POST',json:{op:'remove',id:it.id}}),'从要买里拿掉了'); else shopAdd([bx], d.name); return; }
  if(a==='buyall'){ shopAdd(ing.filter(function(y){ return !openItem(y); }), d.name); return; }
  if(a==='ingadd'){ var v=li.querySelector('#ingInput').value; var add=parseList(v); if(!add.length) return; saveIngredients(d, ing.concat(add.filter(function(y){ return ing.indexOf(y)<0; }))); return; }
  if(a==='ingvoice'){ voiceCapture({btn:el,status:li.querySelector('#ingStatus'),input:li.querySelector('#ingInput'),onText:function(t){ var add=parseList(t); if(!add.length){ li.querySelector('#ingStatus').textContent='没听出食材，再说一次'; return; } saveIngredients(d, ing.concat(add.filter(function(y){ return ing.indexOf(y)<0; }))); }}); return; }
  if(a==='ai'){ li.querySelector('#ingStatus').textContent='AI 正在想…'; api('/api/ingredients',{method:'POST',json:{name:d.name}}).then(function(r){ var items=(r.items||[]).filter(function(y){ return ing.indexOf(y)<0; }); if(!items.length){ li.querySelector('#ingStatus').textContent='AI 没给出新的食材'; return; } return saveIngredients(d, ing.concat(items)); }).catch(function(e){ li.querySelector('#ingStatus').textContent=e.message||'AI 出错了'; }); return; }
  if(a==='mom'){ act(api('/api/dishes/'+d.id+'/update',{method:'POST',json:{mom:!d.mom}}), d.mom?'取消拿手菜':'设为拿手菜了'); return; }
  if(a==='up'||a==='down'){ act(api('/api/dishes/'+d.id+'/move',{method:'POST',json:{direction:a}})); return; }
  if(a==='del'){ if(pendingDelete!==d.id){ pendingDelete=d.id; renderRecipes(); setTimeout(function(){ if(pendingDelete===d.id){ pendingDelete=null; renderRecipes(); } },4000); return; } pendingDelete=null; expandedId=null; act(api('/api/dishes/'+d.id,{method:'DELETE'}),'删掉了'); return; }
}
function shrink(file){
  return new Promise(function(res){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){ var s=Math.min(1,1200/Math.max(img.width,img.height)); var c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(function(b){ res(b||file); },'image/jpeg',0.85); };
    img.onerror=function(){ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}
function uploadPhoto(id, file){ toast('正在上传照片…'); shrink(file).then(function(blob){ return api('/api/dishes/'+id+'/photo',{method:'POST',blob:blob}); }).then(function(){ toast('照片换好了'); return loadState(); }).catch(function(e){ toast(e.message||'照片没传上'); }); }
function addDish(name){
  var v=cleanName(name)||String(name||'').trim(); if(!v) return Promise.resolve();
  return act(api('/api/dishes',{method:'POST',json:{name:v,cat:newCat,mom:role==='mom',by:role}})).then(function(r){ if(r){ toast(r.existed?'菜单里已经有了':'加上了：'+v); if(r.dish){ expandedId=r.dish.id; renderRecipes(); } } $('newDishName').value=''; });
}
$('addForm').onsubmit=function(e){ e.preventDefault(); addDish($('newDishName').value); };
$('btnDishVoice').onclick=function(){ voiceCapture({btn:$('btnDishVoice'),status:$('recipeStatus'),input:$('newDishName'),onText:function(t){ $('newDishName').value=cleanName(t); addDish(t); }}); };
Array.prototype.forEach.call($('newCat').querySelectorAll('button'), function(b){ b.onclick=function(){ newCat=b.getAttribute('data-cat'); Array.prototype.forEach.call($('newCat').querySelectorAll('button'), function(x){ x.classList.toggle('on', x===b); }); }; });

// ---- 身份与页签 ----
function defaultView(){
  var h=new Date().getHours();
  if(role==='mom') return 'today';
  if(role==='kid') return h>=15 ? 'breakfast' : 'order';
  return 'order';
}
function showView(v){
  var allowed=NAV[role]||VIEWS; if(allowed.indexOf(v)<0) v=defaultView();
  VIEWS.forEach(function(x){ $('view-'+x).classList.toggle('active', x===v); });
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function(b){ b.classList.toggle('active', b.getAttribute('data-view')===v); });
}
function buildNav(){
  var nav=$('nav'), views=NAV[role]||VIEWS;
  nav.innerHTML=views.map(function(v){ return '<button type="button" data-view="'+v+'">'+VIEW_NAMES[v]+'</button>'; }).join('');
  Array.prototype.forEach.call(nav.querySelectorAll('button'), function(b){ b.onclick=function(){ showView(b.getAttribute('data-view')); }; });
}
function applyRole(r){
  role=r; document.body.classList.toggle('mom', r==='mom');
  $('who').hidden=true; $('app').hidden=false; buildNav();
  $('roleLine').textContent='这是'+PEOPLE[r].name+'的手机';
  showView(null); render();
}
Array.prototype.forEach.call(document.querySelectorAll('#who button'), function(b){ b.onclick=function(){ var r=b.getAttribute('data-role'); store('bf_role', r); applyRole(r); }; });
$('btnSwitchRole').onclick=function(){ store('bf_role', null); $('app').hidden=true; $('who').hidden=false; };
var saved=load('bf_role');
if(PEOPLE[saved]) applyRole(saved); else $('who').hidden=false;

loadState();
setInterval(loadState, 10000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) loadState(); });
window.addEventListener('online', loadState);
setInterval(render, 60000);
})();
</script>
