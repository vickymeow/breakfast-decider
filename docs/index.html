<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="早饭">
<meta name="theme-color" content="#ffcf4d">
<title>早饭</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
/* 老人优先：浅底、深字、超大字、超大按钮、一屏只放一件事 */
:root{--bg:#fff8e7;--paper:#fff;--fg:#1f1b17;--muted:#6f655a;--line:#eadcb8;--accent:#ffcf4d;--accent-deep:#f0b000;--pick:#ff8c00;--pick-soft:#fff0d2;--good:#1b7a2a;--bad:#c62828;--bad-soft:#ffe3e3;--soft:#ffe9a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:20px;line-height:1.3}
body{padding:env(safe-area-inset-top) max(14px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));max-width:720px;margin:0 auto;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
header{text-align:center;padding:12px 0 2px}
header h1{font-size:38px;margin:0}
header p{font-size:20px;color:var(--muted);margin:4px 0 0;min-height:1.3em}
nav{display:flex;gap:10px;position:sticky;top:env(safe-area-inset-top);background:var(--bg);z-index:5;padding:10px 0}
nav button{flex:1;min-width:0;font-size:26px;font-weight:700;padding:16px 4px;border:3px solid var(--accent-deep);border-radius:18px;background:var(--paper)}
nav button.active{background:var(--accent)}
.view{display:none;padding-top:8px}.view.active{display:block}
.hint{font-size:22px;color:var(--muted);text-align:center;margin:6px 0 14px}
.note{font-size:19px;color:var(--muted);text-align:center;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{min-width:0;overflow:hidden;background:var(--paper);border:4px solid var(--line);border-radius:22px;padding:0;text-align:center;display:flex;flex-direction:column}
.card.selected{border-color:var(--pick);background:var(--pick-soft)}
.pic{position:relative;height:150px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic .emoji{font-size:80px;line-height:1}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.pic img.ok{opacity:1}
.card .name{font-size:28px;font-weight:700;padding:10px 6px 12px;overflow-wrap:anywhere;line-height:1.2}
.card .tick{font-size:19px;color:var(--pick);font-weight:700;padding-bottom:10px;margin-top:-6px}
.special{display:flex;gap:12px;margin-top:16px}
.big-btn{font-size:28px;font-weight:700;padding:20px 16px;border-radius:20px;border:3px solid var(--accent-deep);background:var(--paper);flex:1;min-width:0}
#btnRandom{background:var(--accent)}
#btnSkip{background:var(--bad-soft);border-color:var(--bad)}
.status{font-size:24px;text-align:center;color:var(--good);min-height:1.4em;margin:14px 0 0;font-weight:700}
.morning-card{background:var(--paper);border-radius:28px;overflow:hidden;text-align:center;margin-bottom:16px;border:4px solid var(--line)}
.morning-card .pics{display:grid;grid-template-columns:1fr}
.morning-card .pic{height:auto;aspect-ratio:4/3;max-height:46vh}
.morning-card .pics.multi{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px}
.morning-card .pics.multi .pic{height:170px;aspect-ratio:auto;max-height:none}
.morning-card .pics.multi .pic .emoji{font-size:96px}
.pic .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);color:#fff;font-size:22px;font-weight:700;padding:4px 6px;display:none}
.pics.multi .pic .cap{display:block}
.morning-card .pic .emoji{font-size:150px}
.morning-card .name{font-size:64px;font-weight:800;padding:20px 10px 6px;overflow-wrap:anywhere;line-height:1.1}
.morning-card .sub{font-size:26px;color:var(--muted);padding:0 12px 22px}
#btnSpeak{width:100%;background:var(--accent);font-size:32px;padding:24px}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0;font-size:24px;padding:14px;border-radius:16px;border:3px solid var(--line);background:var(--paper)}
#btnVoice{width:100%;margin-top:10px;background:#e8f5e9;border-color:#7cb97f}
#btnVoice.listening{background:var(--pick-soft);border-color:var(--pick)}
.menu-list{list-style:none;padding:0;margin:16px 0 0}
.menu-list li{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:10px;margin-bottom:10px;min-width:0;flex-wrap:wrap}
.menu-list .thumb{width:76px;height:76px;border-radius:14px;flex-shrink:0;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;position:relative}
.menu-list .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.menu-list .thumb img.ok{opacity:1}
.menu-list .mname{flex:1;min-width:110px;font-size:28px;font-weight:700;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.acts button,.acts label{font-size:24px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);display:inline-block;cursor:pointer}
.acts .del{color:var(--bad)}
.acts .del.confirm{background:var(--bad);border-color:var(--bad);color:#fff}
.acts input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.empty{background:var(--paper);border:3px dashed var(--line);border-radius:22px;padding:28px 16px;text-align:center;font-size:22px;color:var(--muted);grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f1b17;color:#fff;padding:14px 22px;border-radius:16px;font-size:22px;z-index:20;max-width:90vw;text-align:center}
.foot{text-align:center;margin-top:28px;font-size:18px;color:var(--muted)}
.foot button{background:none;border:none;text-decoration:underline;color:var(--muted);font-size:18px;padding:8px}
/* 第一次打开：选我是谁 */
#who{text-align:center;padding:30px 0}
#who h2{font-size:34px;margin:0 0 8px}
#who p{font-size:22px;color:var(--muted);margin:0 0 24px}
#who button{display:block;width:100%;font-size:40px;font-weight:800;padding:34px 20px;border-radius:26px;border:4px solid var(--accent-deep);background:var(--paper);margin-bottom:16px}
#who button.mom{background:var(--accent)}
/* 妈妈模式：字再大一号，少一个页签 */
body.mom{font-size:22px}
body.mom nav button{font-size:30px;padding:20px 4px}
body.mom .morning-card .name{font-size:76px}
body.mom .morning-card .sub{font-size:30px}
body.mom #btnSpeak{font-size:36px;padding:28px}
body.mom .menu-list .mname,body.mom .card .name{font-size:30px}
@media (prefers-reduced-motion:no-preference){.card:active,.big-btn:active,nav button:active{transform:scale(.97)}}
</style>
</head>
<body>
<header><h1>🍜 早饭</h1><p id="dateLine"></p></header>

<section id="who" hidden>
  <h2>这是谁的手机？</h2>
  <p>选一次就记住了，以后不再问</p>
  <button type="button" class="mom" data-role="mom">👩 我是妈妈</button>
  <button type="button" data-role="kid">👧 我是女儿</button>
</section>

<div id="app" hidden>
<nav>
  <button type="button" data-view="pick">选早饭</button>
  <button type="button" data-view="morning">今天早上</button>
  <button type="button" data-view="menu">菜单</button>
</nav>

<section id="view-pick" class="view">
  <p class="hint">点图片就选好啦，可以选几样，再点一下取消。早上 6 点还没选就自动随机一样</p>
  <div id="pickGrid" class="grid"></div>
  <div class="special">
    <button type="button" id="btnRandom" class="big-btn">随便</button>
    <button type="button" id="btnSkip" class="big-btn">今天不吃</button>
  </div>
  <p id="pickStatus" class="status"></p>
</section>

<section id="view-morning" class="view">
  <div id="morningCard" class="morning-card"></div>
  <button type="button" id="btnSpeak" class="big-btn">🔊 读给我听</button>
  <p id="speakNote" class="note"></p>
</section>

<section id="view-menu" class="view">
  <p class="hint">加新菜、拍张照片、删除、上下移动</p>
  <form class="add-row" id="addForm">
    <input id="newDishName" placeholder="输入菜名，或按键盘 🎤 说话" autocomplete="off">
    <button type="submit" id="btnAdd" class="big-btn" style="flex:0 0 auto">加菜</button>
  </form>
  <button type="button" id="btnVoice" class="big-btn">🎤 语音加菜</button>
  <p id="voiceStatus" class="note"></p>
  <ul id="menuList" class="menu-list"></ul>
</section>

<p id="syncNote" class="note"></p>
<p class="foot"><span id="roleLine"></span> <button type="button" id="btnSwitchRole">换个人</button></p>
</div>

<script src="config.js"></script>
<script>
(function(){
'use strict';
var BASE = String(window.BREAKFAST_API || '').replace(/\/+$/, '');
var FALLBACK_NAME = '鸡蛋三明治', FALLBACK_EMOJI = '🥪';
var EMOJI_RULES = [['三明治','🥪'],['汉堡','🍔'],['吐司','🍞'],['面包','🍞'],['馒头','🍞'],['花卷','🍞'],['馄饨','🥟'],['云吞','🥟'],['饺','🥟'],['包子','🥟'],['小笼','🥟'],['烧卖','🥟'],['炒饭','🍚'],['米饭','🍚'],['饭团','🍙'],['粥','🥣'],['麦片','🥣'],['燕麦','🥣'],['意面','🍝'],['荞麦','🍝'],['面','🍜'],['粉','🍜'],['蛋','🥚'],['煎饼','🥞'],['饼','🥞'],['华夫','🧇'],['牛奶','🥛'],['豆浆','🥛'],['酸奶','🥛'],['油条','🥖'],['香蕉','🍌'],['苹果','🍎'],['水果','🍎'],['汤','🍲'],['火腿','🥓'],['培根','🥓'],['香肠','🌭'],['红薯','🍠'],['玉米','🌽']];
function emojiFor(name){ for (var i=0;i<EMOJI_RULES.length;i++){ if (name.indexOf(EMOJI_RULES[i][0])>=0) return EMOJI_RULES[i][1]; } return '🍽️'; }

var state = { dishes: [], pick: null, pickDate: null };
var loaded = false, role = null, pendingDelete = null, lastOk = 0;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var toastTimer;
function toast(msg){ var t=document.querySelector('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t);} t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.hidden=true; },2600); }
function store(k,v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){} }
function load(k){ try{ return localStorage.getItem(k);}catch(e){ return null; } }

function pad(n){ return (n<10?'0':'')+n; }
function localDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function targetDate(){ var now=new Date(), d=new Date(now); if(now.getHours()>=15) d.setDate(d.getDate()+1); return localDate(d); }
function dateLabel(ds){
  var p=ds.split('-').map(Number), dd=new Date(p[0],p[1]-1,p[2]), w='日一二三四五六';
  var base=p[1]+'月'+p[2]+'日 周'+w[dd.getDay()], t=new Date(); t.setDate(t.getDate()+1);
  if (ds===localDate(new Date())) return '今天 '+base; if (ds===localDate(t)) return '明天 '+base; return base;
}
function pickIsCurrent(){ return state.pick && state.pickDate===targetDate(); }
function picHtml(d, cap){
  var em = '<span class="emoji" aria-hidden="true">'+esc(d.emoji||emojiFor(d.name))+'</span>';
  var img = d.image ? '<img src="'+esc(d.image)+'" alt="" loading="lazy" onload="this.className=\'ok\'" onerror="this.remove()">' : '';
  return '<div class="pic">'+em+img+(cap?'<span class="cap">'+esc(d.name)+'</span>':'')+'</div>';
}
function pickedIds(cur){ if(!cur||cur.type==='skip') return []; if(cur.dishes&&cur.dishes.length) return cur.dishes.slice(); return cur.dish!=null?[cur.dish]:[]; }
function dishById(id){ var l=state.dishes||[]; for(var i=0;i<l.length;i++) if(l[i].id===id) return l[i]; return null; }

// ---- 网络 ----
function api(path, opts){
  opts = opts || {};
  var o = { method: opts.method||'GET', headers: {} };
  if (opts.json){ o.headers['Content-Type']='application/json'; o.body=JSON.stringify(opts.json); }
  if (opts.blob){ o.headers['Content-Type']=opts.blob.type||'image/jpeg'; o.body=opts.blob; }
  if(!BASE){ return Promise.reject(new Error('还没配置接口地址（docs/config.js）')); }
  return fetch(BASE+path, o).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok) throw new Error(j.error||('出错了 '+r.status)); return j; });
  });
}
function loadState(){
  var now=new Date();
  return api('/api/state?date='+localDate(now)+'&hour='+now.getHours()).then(function(s){ state=s; loaded=true; lastOk=Date.now(); $('syncNote').textContent=''; render(); })
    .catch(function(){ if(!loaded) $('syncNote').textContent='连不上网，正在重试…'; else if(Date.now()-lastOk>60000) $('syncNote').textContent='网络不太好，显示的可能不是最新的'; render(); });
}
function act(p){ return p.then(loadState).catch(function(e){ toast(e.message||'没成功，请再试一次'); }); }

// ---- 渲染 ----
function render(){
  var td=targetDate(), cur=pickIsCurrent()?state.pick:null, list=state.dishes||[];
  $('dateLine').textContent = '选的是 '+dateLabel(td)+' 的早饭';

  var grid=$('pickGrid');
  if(!loaded) grid.innerHTML='<div class="empty">正在打开菜单…</div>';
  else if(!list.length) grid.innerHTML='<div class="empty">菜单还是空的，到「菜单」页加第一道菜吧。</div>';
  else { var selIds=pickedIds(cur); grid.innerHTML=list.map(function(d){ var sel=selIds.indexOf(d.id)>=0; return '<button type="button" class="card'+(sel?' selected':'')+'" data-id="'+d.id+'" aria-pressed="'+(sel?'true':'false')+'">'+picHtml(d)+'<div class="name">'+esc(d.name)+'</div>'+(sel?'<div class="tick">✓ 就吃这个</div>':'')+'</button>'; }).join(''); }
  Array.prototype.forEach.call(grid.querySelectorAll('.card'), function(el){ el.onclick=function(){
    var ids=pickedIds(cur), id=Number(el.getAttribute('data-id')), k=ids.indexOf(id);
    if(k>=0) ids.splice(k,1); else ids.push(id);
    act(api('/api/pick',{method:'POST',json:{type:'dishes',ids:ids,date:td}}).then(function(r){ toast(r.pick ? '选好了：'+r.pick.resolvedName : '取消了，还没选'); }));
  }; });
  var autoH=state.autoPickHour||6;
  $('pickStatus').textContent = cur ? (cur.type==='skip'?'已选好：今天不吃':'已选好：'+cur.resolvedName+(cur.auto?'（早上 '+autoH+' 点没人选，自动随机的）':cur.type==='random'?'（随便选的）':'')) : (loaded?'还没选。早上 '+autoH+' 点还没选的话，自动随机一样':'');
  $('btnRandom').disabled=!list.length;

  var mc=$('morningCard'), name, sub, body;
  var speakText;
  if(cur&&cur.type==='skip'){ name='今天不吃'; sub='不用做'; body='<div class="pics"><div class="pic"><span class="emoji">😴</span></div></div>'; speakText='今天不吃早饭，不用做'; }
  else if(cur){
    var ds=pickedIds(cur).map(dishById).filter(Boolean);
    name=cur.resolvedName||ds.map(function(d){ return d.name; }).join('＋');
    sub=cur.auto?'没人选，早上 '+(state.autoPickHour||6)+' 点自动随机的':cur.type==='random'?'随便选的，就它了':(ds.length>1?'女儿选的，这几样一起':'女儿选的');
    body='<div class="pics'+(ds.length>1?' multi':'')+'">'+(ds.length?ds.map(function(d){ return picHtml(d, ds.length>1); }).join(''):'<div class="pic"><span class="emoji">'+emojiFor(name)+'</span></div>')+'</div>';
    var ns=ds.length?ds.map(function(d){ return d.name; }):[name];
    speakText='今天早饭是'+(ns.length>1?ns.slice(0,-1).join('、')+'和'+ns[ns.length-1]:ns[0]);
  }
  else { name=FALLBACK_NAME; sub=loaded?'没选，就做这个':'正在连接…'; body='<div class="pics"><div class="pic"><span class="emoji">'+FALLBACK_EMOJI+'</span></div></div>'; speakText='今天早饭是'+FALLBACK_NAME; }
  mc.innerHTML=body+'<div class="name">'+esc(name)+'</div>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'');
  mc.setAttribute('data-speak', speakText);

  var ml=$('menuList');
  if(!loaded) ml.innerHTML='';
  else if(!list.length) ml.innerHTML='<li class="empty" style="display:block">还没有菜。在上面输入菜名，点「加菜」。</li>';
  else ml.innerHTML=list.map(function(d,i){
    var th='<div class="thumb">'+esc(d.emoji||emojiFor(d.name))+(d.image?'<img src="'+esc(d.image)+'" alt="" onload="this.className=\'ok\'" onerror="this.remove()">':'')+'</div>';
    return '<li><div class="thumb-wrap">'+th+'</div><span class="mname">'+esc(d.name)+'</span><div class="acts">'
      +'<label title="拍照或选图">📷<input type="file" accept="image/*" data-id="'+d.id+'"></label>'
      +'<button type="button" data-act="up" data-id="'+d.id+'" '+(i===0?'disabled':'')+' aria-label="上移">↑</button>'
      +'<button type="button" data-act="down" data-id="'+d.id+'" '+(i===list.length-1?'disabled':'')+' aria-label="下移">↓</button>'
      +'<button type="button" class="del'+(pendingDelete===d.id?' confirm':'')+'" data-act="del" data-id="'+d.id+'">'+(pendingDelete===d.id?'确定删除？':'删除')+'</button></div></li>';
  }).join('');
  Array.prototype.forEach.call(ml.querySelectorAll('button'), function(b){ b.onclick=function(){ menuAction(b.getAttribute('data-act'), Number(b.getAttribute('data-id'))); }; });
  Array.prototype.forEach.call(ml.querySelectorAll('input[type=file]'), function(inp){ inp.onchange=function(){ if(inp.files[0]) uploadPhoto(Number(inp.getAttribute('data-id')), inp.files[0]); }; });
}

function menuAction(a, id){
  if(a==='del'){
    if(pendingDelete!==id){ pendingDelete=id; render(); setTimeout(function(){ if(pendingDelete===id){ pendingDelete=null; render(); } },4000); return; }
    pendingDelete=null; return act(api('/api/dishes/'+id,{method:'DELETE'}).then(function(){ toast('删掉了'); }));
  }
  return act(api('/api/dishes/'+id+'/move',{method:'POST',json:{direction:a}}));
}
function shrink(file){
  return new Promise(function(res){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){ var s=Math.min(1,1200/Math.max(img.width,img.height)); var c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(function(b){ res(b||file); },'image/jpeg',0.85); };
    img.onerror=function(){ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}
function uploadPhoto(id, file){
  toast('正在上传照片…');
  shrink(file).then(function(blob){ return api('/api/dishes/'+id+'/photo',{method:'POST',blob:blob}); })
    .then(function(){ toast('照片换好了'); return loadState(); })
    .catch(function(e){ toast(e.message||'照片没传上'); });
}
$('btnRandom').onclick=function(){ act(api('/api/pick',{method:'POST',json:{type:'random',date:targetDate()}}).then(function(r){ toast('随便选了：'+r.pick.resolvedName); })); };
$('btnSkip').onclick=function(){ act(api('/api/pick',{method:'POST',json:{type:'skip',date:targetDate()}}).then(function(){ toast('好，今天不吃'); })); };
$('addForm').onsubmit=function(e){ e.preventDefault(); var inp=$('newDishName'), name=inp.value.trim(); if(!name) return; act(api('/api/dishes',{method:'POST',json:{name:name}}).then(function(){ toast('已加上：'+name); inp.value=''; })); };

// ---- 朗读 ----
function speak(text){
  if(!('speechSynthesis' in window)){ $('speakNote').textContent='这个手机不能朗读，看上面的大字就好'; return; }
  var u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=0.85;
  var vs=speechSynthesis.getVoices(); for(var i=0;i<vs.length;i++){ if(/^zh/i.test(vs[i].lang)){ u.voice=vs[i]; break; } }
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
$('btnSpeak').onclick=function(){ speak($('morningCard').getAttribute('data-speak')||''); };
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=function(){};

// ---- 语音加菜 ----
// 三级方案：1) 后端录音识别（配置了 OPENAI_API_KEY 时，微信里也能用）
//          2) 浏览器自带语音识别（Chrome / Safari）
//          3) 手机键盘上的话筒键听写
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var inWeChat=/MicroMessenger/i.test(navigator.userAgent);
var canRecord=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
var recorder=null;
function cleanName(t){ return String(t||'').replace(/[。，,.!！?？、\s]+/g,'').replace(/^(加|加上|加一个|加个|我要|来个|来一个)/,'').trim().slice(0,30); }
function addByVoice(name, vs){
  if(!name){ vs.textContent='没听清，请再说一次'; return; }
  vs.textContent='听到：'+name+'，正在加…';
  return act(api('/api/dishes',{method:'POST',json:{name:name}}).then(function(){ toast('已加上：'+name); vs.textContent='已加上：'+name; }));
}
function keyboardDictation(prefix){
  var inp=$('newDishName'), vs=$('voiceStatus');
  inp.value=''; inp.focus();
  vs.textContent=(prefix||'')+'请点键盘上的 🎤 话筒键说菜名，说完点「加菜」';
}
function setRecUi(on){ var btn=$('btnVoice'); btn.classList.toggle('listening',on); btn.textContent=on?'⏹ 说完了，点这里':'🎤 语音加菜'; }
function recordAndTranscribe(){
  var vs=$('voiceStatus');
  if(recorder){ if(recorder.state==='recording') recorder.stop(); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var types=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/aac'];
    var mime=null; for(var i=0;i<types.length;i++){ if(window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(types[i])){ mime=types[i]; break; } }
    var rec; try{ rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream); }catch(e){ stream.getTracks().forEach(function(t){ t.stop(); }); keyboardDictation('这个浏览器不能录音。'); return; }
    var chunks=[]; recorder=rec;
    rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onstop=function(){
      stream.getTracks().forEach(function(t){ t.stop(); }); recorder=null; setRecUi(false);
      var type=(rec.mimeType||mime||'audio/mp4').split(';')[0];
      var blob=new Blob(chunks,{type:type});
      if(blob.size<1000){ vs.textContent='没录到声音，再点一次，按住说话的时间长一点'; return; }
      vs.textContent='正在识别…';
      api('/api/transcribe',{method:'POST',blob:blob}).then(function(r){ return addByVoice(cleanName(r.text), vs); })
        .catch(function(e){ vs.textContent=(e&&e.message)||'识别失败，请再试一次'; });
    };
    rec.start(); setRecUi(true); vs.textContent='正在听…请说菜名，说完点上面的按钮';
    setTimeout(function(){ if(recorder===rec&&rec.state==='recording') rec.stop(); },10000);
  }).catch(function(){ keyboardDictation('没有麦克风权限。'); });
}
function browserRecognize(){
  var vs=$('voiceStatus'), btn=$('btnVoice');
  var r; try{ r=new SR(); }catch(e){ keyboardDictation(''); return; }
  r.lang='zh-CN'; r.interimResults=true; r.maxAlternatives=1; r.continuous=false;
  var heard='', failed=false;
  vs.textContent='请说菜名…'; btn.classList.add('listening');
  r.onresult=function(e){ var t=''; for(var i=0;i<e.results.length;i++){ t+=e.results[i][0].transcript; } if(t){ heard=t; vs.textContent='听到：'+t; } };
  r.onerror=function(e){
    failed=true; btn.classList.remove('listening');
    if(e.error==='no-speech'){ vs.textContent='没听到声音，再点一次，离手机近一点说'; return; }
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){ keyboardDictation('没有麦克风权限。'); return; }
    keyboardDictation('这个浏览器不能直接听。');
  };
  r.onend=function(){ btn.classList.remove('listening'); if(failed) return; addByVoice(cleanName(heard), vs); };
  try{ r.start(); }catch(e){ btn.classList.remove('listening'); keyboardDictation(''); }
}
$('btnVoice').onclick=function(){
  if(state.voice&&canRecord){ recordAndTranscribe(); return; }
  if(SR&&!inWeChat){ browserRecognize(); return; }
  keyboardDictation('');
};

// ---- 角色与页面 ----
var VIEWS=['pick','morning','menu'];
function showView(v){
  if(VIEWS.indexOf(v)<0) v = role==='mom' ? 'morning' : (new Date().getHours()<15 ? 'morning' : 'pick');
  VIEWS.forEach(function(x){ $('view-'+x).classList.toggle('active', x===v); });
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function(b){ b.classList.toggle('active', b.getAttribute('data-view')===v); });
}
Array.prototype.forEach.call(document.querySelectorAll('nav button'), function(b){ b.onclick=function(){ showView(b.getAttribute('data-view')); }; });
function applyRole(r){
  role=r; document.body.classList.toggle('mom', r==='mom');
  $('who').hidden=true; $('app').hidden=false;
  document.querySelector('nav button[data-view="pick"]').style.display = r==='mom' ? 'none' : '';
  $('roleLine').textContent = r==='mom' ? '这是妈妈的手机' : '这是女儿的手机';
  showView(null); render();
}
Array.prototype.forEach.call(document.querySelectorAll('#who button'), function(b){ b.onclick=function(){ var r=b.getAttribute('data-role'); store('bf_role', r); applyRole(r); }; });
$('btnSwitchRole').onclick=function(){ store('bf_role', null); $('app').hidden=true; $('who').hidden=false; };
var saved=load('bf_role');
if(saved==='mom'||saved==='kid') applyRole(saved); else $('who').hidden=false;

loadState();
setInterval(loadState, 10000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) loadState(); });
window.addEventListener('online', loadState);
setInterval(render, 60000);
})();
</script>
