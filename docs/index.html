<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="吃什么">
<meta name="theme-color" content="#ffcf4d">
<title>吃什么</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
/* 老人优先：浅底深字、超大字、大按钮；妈妈只做三件事：看、点一下、打钩 */
:root{--bg:#fff8e7;--paper:#fff;--fg:#1f1b17;--muted:#6f655a;--line:#eadcb8;--accent:#ffcf4d;--accent-deep:#f0b000;--pick:#ff8c00;--pick-soft:#fff0d2;--good:#1b7a2a;--good-soft:#e3f5e4;--bad:#c62828;--bad-soft:#ffe3e3;--soft:#ffe9a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:20px;line-height:1.3}
body{padding:env(safe-area-inset-top) max(14px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));max-width:720px;margin:0 auto;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
header{text-align:center;padding:10px 0 2px;position:relative}
#btnProfile{position:absolute;right:0;top:8px;width:58px;height:58px;border-radius:50%;border:3px solid var(--accent-deep);background:var(--paper);padding:0;overflow:hidden;font-size:32px;display:flex;align-items:center;justify-content:center}
#btnProfile .av{width:100%;height:100%;background:none}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;background:var(--soft);position:relative;flex-shrink:0;width:1.7em;height:1.7em;vertical-align:middle;line-height:1}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.xl{width:120px;height:120px;font-size:70px;border:4px solid var(--accent-deep)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{font-size:26px;margin:0 0 8px}
.sheet .who-row{display:flex;gap:8px}
.sheet .who-row button{flex:1;min-width:0;font-size:20px;font-weight:700;padding:12px 4px;border-radius:18px;border:3px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;gap:6px}
.sheet .who-row button.on{border-color:var(--accent-deep);background:var(--accent)}
.sheet .who-row .av{width:56px;height:56px;font-size:34px}
.big-btn.sm{width:auto;display:inline-block;padding:8px 14px;font-size:19px;flex:none}
.hrow{padding:12px 0;border-top:2px solid var(--line)}
.hrow:first-child{border-top:none;padding-top:0}
.hrow .hl{font-size:24px;font-weight:800;margin-bottom:8px}
.hrow .hl small{font-size:18px;color:var(--muted);font-weight:400}
.home-row.three{gap:8px}
.home-row.three button{font-size:21px;padding:14px 2px;border-width:3px}
.home-row button.on.maybe{background:var(--soft);border-color:var(--accent-deep)}
.sg{margin:0 0 10px}
.sg .sgl{display:block;font-size:18px;color:var(--muted);font-weight:700;margin:0 0 6px}
.hb{color:#b3261e;font-weight:800;white-space:nowrap}
.hbmsg{display:inline-block;margin-left:4px;padding:1px 8px;border-radius:999px;background:#fde4e1;color:#b3261e;font-size:.8em;font-weight:700;white-space:nowrap;vertical-align:middle}
.sheet h4.hbh{font-size:20px;color:var(--muted);margin:14px 0 8px}
.push-card{background:var(--paper);border:4px solid var(--accent-deep);border-radius:24px;padding:14px;margin-bottom:14px}
.push-card h3{font-size:24px;margin:0 0 6px}
.push-card p{font-size:20px;color:var(--muted);margin:0 0 10px;line-height:1.4}
.wish .n small{display:block;font-size:17px;color:var(--muted);font-weight:400}
.wish .x.go{border-color:var(--accent-deep);background:var(--accent);color:var(--fg);font-weight:700;font-size:20px;padding:10px 14px}
.wish .x.red{border-color:#b3261e;color:#b3261e;font-weight:700}
button.secfold{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;border:none;background:none;padding:8px 0;margin:14px 0 4px;font-size:24px;font-weight:800;color:var(--fg)}
button.secfold small{font-size:18px;color:var(--muted);font-weight:400}
button.secfold .arr{font-size:18px;color:var(--muted);width:20px}
header h1{font-size:34px;margin:0}
header p{font-size:19px;color:var(--muted);margin:2px 0 0;min-height:1.3em}
nav{display:flex;gap:10px;position:sticky;top:env(safe-area-inset-top);background:var(--bg);z-index:5;padding:10px 0}
nav button{flex:1;min-width:0;font-size:1.35em;font-weight:700;padding:16px 4px;border:3px solid var(--accent-deep);border-radius:18px;background:var(--paper)}
nav button.active{background:var(--accent)}
nav button{position:relative;white-space:nowrap}
/* 女儿、小陈有 4 个页签：三个字的名字也要放得下 */
nav.four{gap:6px}
nav.four button{font-size:21px;padding:14px 2px}
nav .badge{position:absolute;top:-8px;right:-6px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--bad);color:#fff;font-size:16px;line-height:26px;text-align:center}
.view{display:none;padding-top:6px}.view.active{display:block}
.hint{font-size:21px;color:var(--muted);text-align:center;margin:6px 0 12px}
.note{font-size:19px;color:var(--muted);text-align:center;margin:8px 0;min-height:1.3em}
h2.sec{font-size:26px;margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
h2.sec small{font-size:18px;color:var(--muted);font-weight:400}
h3.sec{font-size:22px;color:var(--muted);margin:18px 0 8px}
h3.sec small{font-size:17px;font-weight:400}
.box{background:var(--paper);border:4px solid var(--line);border-radius:24px;padding:14px;margin-bottom:14px}
.box h3{font-size:22px;margin:0 0 10px;color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}
.big-btn{font-size:26px;font-weight:700;padding:18px 16px;border-radius:20px;border:3px solid var(--accent-deep);background:var(--paper);flex:1;min-width:0}
.big-btn.primary{background:var(--accent)}
.big-btn.ghost{background:var(--bg);border-color:var(--line);color:var(--muted);font-size:22px;padding:14px}
.big-btn.danger{background:var(--bad-soft);border-color:var(--bad)}
.mic{font-size:26px;padding:0 16px;border-radius:16px;border:3px solid #7cb97f;background:#e8f5e9;flex:0 0 auto}
.mic.listening{background:var(--pick-soft);border-color:var(--pick)}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0;font-size:22px;padding:14px;border-radius:16px;border:3px solid var(--line);background:var(--paper)}
.add-row .big-btn{flex:0 0 auto;font-size:22px;padding:12px 16px}
/* 图片卡片网格（早饭选择、点菜） */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{min-width:0;overflow:hidden;background:var(--paper);border:4px solid var(--line);border-radius:22px;padding:0;text-align:center;display:flex;flex-direction:column}
.card.selected{border-color:var(--pick);background:var(--pick-soft)}
.pic{position:relative;height:140px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic .emoji{font-size:76px;line-height:1}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.pic img.ok{opacity:1}
.pic .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);color:#fff;font-size:22px;font-weight:700;padding:4px 6px;display:none}
.pics.multi .pic .cap{display:block}
.card .name{font-size:26px;font-weight:700;padding:8px 6px 10px;overflow-wrap:anywhere;line-height:1.2}
.card .tick{font-size:18px;color:var(--pick);font-weight:700;padding-bottom:8px;margin-top:-4px}
.card .meta{font-size:17px;color:var(--muted);padding-bottom:8px;margin-top:-4px}
.special{display:flex;gap:12px;margin-top:16px}
#btnRandom{background:var(--accent)}
#btnSkip{background:var(--bad-soft);border-color:var(--bad)}
.status{font-size:22px;text-align:center;color:var(--good);min-height:1.4em;margin:12px 0 0;font-weight:700}
/* 早饭答案 */
.morning-card{background:var(--paper);border-radius:28px;overflow:hidden;text-align:center;margin-bottom:12px;border:4px solid var(--line)}
.morning-card .pics{display:grid;grid-template-columns:1fr}
.morning-card .pic{height:auto;aspect-ratio:4/3;max-height:40vh}
.morning-card .pic .emoji{font-size:130px}
.morning-card .pics.multi{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px}
.morning-card .pics.multi .pic{height:160px;aspect-ratio:auto;max-height:none}
.morning-card .pics.multi .pic .emoji{font-size:90px}
.morning-card .name{font-size:56px;font-weight:800;padding:16px 10px 6px;overflow-wrap:anywhere;line-height:1.1}
.morning-card .sub{font-size:24px;color:var(--muted);padding:0 12px 18px}
#btnSpeak{width:100%;background:var(--accent);font-size:30px;padding:22px;margin:0 0 14px}
/* 晚饭 */
.count{font-size:38px;font-weight:800;margin:0 0 6px}
.count small{display:block;font-size:19px;color:var(--muted);font-weight:400}
.person{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px solid var(--line);font-size:23px;flex-wrap:wrap}
.person .who{font-weight:800;min-width:84px}
.st{padding:4px 12px;border-radius:999px;font-size:19px;font-weight:700;background:var(--bg);border:2px solid var(--line)}
.st.yes{background:var(--good-soft);border-color:#2e7d32;color:#1b5e20}
.st.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.st.maybe{color:var(--muted)}
.person .pw{color:var(--muted);flex:1;min-width:120px;overflow-wrap:anywhere;font-size:20px}
.cook-card{background:var(--soft);border-radius:24px;padding:16px;text-align:center;margin-bottom:12px}
.cook-card .lab{font-size:20px;color:var(--muted)}
.cook-card .txt{font-size:46px;font-weight:800;line-height:1.15;overflow-wrap:anywhere;margin:4px 0}
.cook-card .txt.none{font-size:26px;color:var(--muted);font-weight:400}
.cook-card .for{font-size:20px;color:var(--good);font-weight:700;margin-bottom:8px}
.cook-card .tmr{font-size:20px;color:var(--muted);margin-top:10px;border-top:2px solid rgba(0,0,0,.08);padding-top:10px}
.cook-card .tmr b{color:var(--fg)}
.cook-card .tmr .dw{font-size:18px;margin-top:4px}
.cook-card .tmr .dl{font-size:22px}
.cook-card button{margin-top:8px}
.chooser{background:var(--paper);border:4px solid var(--pick);border-radius:24px;padding:14px;margin-bottom:14px}
.chooser h3{font-size:24px;margin:0 0 8px}
.chooser h4{font-size:19px;color:var(--muted);margin:14px 0 6px;font-weight:700}
.chooser .row .primary{flex-basis:100%;font-size:30px;padding:20px}
.chooser .row .danger,.chooser .row .ghost{font-size:22px;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-size:22px;padding:10px 14px;border-radius:999px;border:2px solid var(--line);background:var(--bg);display:flex;align-items:center;gap:6px;max-width:100%}
.chips button.on{background:var(--accent);border-color:var(--accent-deep)}
.chips button small{font-size:16px;color:var(--muted);font-weight:400}
.chips button.on small{color:#5a4600}
.chips.big button{font-size:26px;padding:14px 18px}
.chips button.x{border-style:dashed}
.chooser .chips button{flex-wrap:wrap;text-align:left}
.chooser .chips button .cn{overflow-wrap:anywhere}
/* 心愿单、菜谱列表 */
.home-row{display:flex;gap:12px}
.home-row button{flex:1;min-width:0;font-size:28px;font-weight:800;padding:20px 10px;border-radius:20px;border:4px solid var(--line);background:var(--bg)}
.home-row button.on.yes{background:var(--good-soft);border-color:#2e7d32}
.home-row button.on.no{background:var(--bad-soft);border-color:var(--bad)}
.wish{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:8px;font-size:22px;flex-wrap:wrap}
.wish .n{font-weight:800;flex:1;min-width:120px;overflow-wrap:anywhere}
.wish .w{color:var(--muted);font-size:19px}
.wish .x{font-size:18px;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--muted)}
.wish.done{opacity:.6}
/* 点菜名 → 菜谱本里这道菜（看食材，点「买」进菜篮子） */
button.dlink{border:none;background:none;padding:0;margin:0;font:inherit;font-weight:800;color:inherit;text-align:left;text-decoration:underline;text-decoration-color:var(--accent-deep);text-decoration-thickness:2px;text-underline-offset:5px;cursor:pointer}
button.dlink .go{font-size:.75em;color:var(--accent-deep);margin-left:2px;text-decoration:none;display:inline-block}
.menu-list{list-style:none;padding:0;margin:0 0 8px}
.menu-list li{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:10px;margin-bottom:10px;min-width:0}
.menu-list .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.menu-list .thumb{width:68px;height:68px;border-radius:14px;flex-shrink:0;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;position:relative}
.menu-list .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.menu-list .thumb img.ok{opacity:1}
.menu-list .mname{flex:1;min-width:110px;font-size:25px;font-weight:700;overflow-wrap:anywhere}
.menu-list .mname small{display:block;font-size:17px;color:var(--muted);font-weight:400}
.menu-list .open{font-size:20px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);flex-shrink:0}
.menu-list .drag{flex-shrink:0;width:44px;height:60px;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted);border:2px dashed var(--line);border-radius:12px;background:var(--bg);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.menu-list li.dragging{border-color:var(--pick);background:var(--pick-soft);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.menu-list li.dragging .drag{border-color:var(--pick);color:var(--pick);cursor:grabbing}
.menu-tip{font-size:18px;color:var(--muted);background:var(--paper);border:2px dashed var(--line);border-radius:14px;padding:10px 12px;margin:4px 0 6px;line-height:1.5}
.menu-tip b{color:var(--fg)}
/* 菜谱本：「我想做」→ 选哪天 */
.menu-list .want{display:inline-block;margin-top:8px;font-size:20px;font-weight:800;padding:8px 14px;border-radius:999px;border:3px solid var(--accent-deep);background:var(--accent);color:var(--fg)}
.menu-list .ptag{display:inline-block;margin:8px 0 0 6px;font-size:17px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--good-soft);color:#1b5e20;border:2px solid #2e7d32;vertical-align:middle}
.daypick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;padding:14px 16px;margin-bottom:8px;border-radius:18px;border:3px solid var(--line);background:var(--paper);font-size:24px}
.daypick button b{font-size:25px}
.daypick button small{font-size:18px;color:var(--muted);font-weight:400}
.daypick button:not(:disabled):active{border-color:var(--accent-deep);background:var(--accent)}
.daypick button:disabled{opacity:.5}
.sheet .bigdone{font-size:34px;font-weight:800;line-height:1.2;margin:4px 0 14px;overflow-wrap:anywhere}
.sughead{display:flex;align-items:center;gap:8px}
.sughead .secfold{flex:1;min-width:0;margin:6px 0}
.detail{margin-top:12px;border-top:2px solid var(--line);padding-top:12px}
.detail .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.detail .acts button,.detail .acts label{font-size:20px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);cursor:pointer;display:inline-block}
.detail .acts .del{color:var(--bad)}
.detail .acts .del.confirm{background:var(--bad);border-color:var(--bad);color:#fff}
.detail .acts input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.detail .ing{margin:6px 0 10px}
.ingchip{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg);max-width:100%}
.ingchip .nm{font-size:22px;padding:10px 6px 10px 14px}
.ingchip button.buy{border:none;border-left:2px solid var(--line);background:var(--paper);font-size:20px;font-weight:700;padding:10px 14px;color:var(--accent-deep)}
.ingchip button.buy.on{background:var(--accent);color:var(--fg)}
/* 买菜 */
.chips button .tag{font-size:14px;padding:1px 6px;border-radius:999px;background:var(--pick);color:#fff;font-weight:700}
.plan-dish{border-top:2px solid var(--line);padding:10px 0}
.plan-dish:first-of-type{border-top:none;padding-top:0}
.plan-dish .t{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:24px;font-weight:800}
.plan-dish .t .fold{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;border:none;background:none;padding:6px 0;font:inherit;color:inherit}
.plan-dish .t .fold .arr{font-size:18px;color:var(--muted);flex-shrink:0;width:18px}
.plan-dish .t .fold small{font-size:16px;color:var(--muted);font-weight:400}
.plan-dish .sum{font-size:19px;color:var(--muted);margin:-2px 0 4px 26px}
.plan-dish .t button{margin-left:auto;font-size:19px;padding:8px 12px;border-radius:12px;border:2px solid var(--accent-deep);background:var(--paper);flex-shrink:0}
.shop-row{display:flex;align-items:stretch;gap:8px;margin-bottom:8px}
.shop-row .shop-item{margin:0;flex:1;min-width:0}
.shop-row .store{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0 14px;border-radius:18px;border:3px solid #2e7d32;background:var(--good-soft);color:#1b5e20;font-size:20px;font-weight:800;text-decoration:none;white-space:nowrap}
.shop-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px;font-size:26px;font-weight:700}
.shop-item .bx{width:38px;height:38px;border-radius:50%;border:3px solid var(--accent-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:24px;background:var(--bg)}
.shop-item .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.shop-item .nm small{display:block;font-size:16px;color:var(--muted);font-weight:400}
.shop-item.done{opacity:.55}
.shop-item.done .nm{text-decoration:line-through}
.shop-item.done .bx{background:var(--good-soft);border-color:#2e7d32}
.empty{background:var(--paper);border:3px dashed var(--line);border-radius:22px;padding:24px 16px;text-align:center;font-size:21px;color:var(--muted);grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;background:#1f1b17;color:#fff;padding:14px 22px;border-radius:16px;font-size:22px;z-index:20;max-width:90vw;text-align:center}
.foot{text-align:center;margin-top:28px;font-size:18px;color:var(--muted)}
.foot button{background:var(--paper);border:2px solid var(--line);border-radius:16px;color:var(--muted);font-size:20px;padding:12px 18px}
#who{text-align:center;padding:30px 0}
#who h2{font-size:34px;margin:0 0 8px}
#who p{font-size:22px;color:var(--muted);margin:0 0 24px}
#who button{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;font-size:38px;font-weight:800;padding:26px 20px;border-radius:26px;border:4px solid var(--accent-deep);background:var(--paper);margin-bottom:16px}
#who button.mom{background:var(--accent)}
/* 妈妈模式：字再大一号 */
/* 动态 / 账本 / 做好了 */

<script src="config.js"></script>
<script>
(function(){

function ago(iso){ var m=Math.floor((Date.now()-new Date(iso).getTime())/60000); if(m<1) return '刚刚'; if(m<60) return m+' 分钟前'; var d=localDate(new Date(iso)); if(d===today()) return '今天 '+new Date(iso).toTimeString().slice(0,5); if(d===addDays(today(),-1)) return '昨天'; return weekday(d); }

function nightFull(date){ var l=nightLabel(date), w=weekday(date); return l.indexOf(w)===0?l:l+' '+w; }

// 红包旁边带一句给妈妈的话；没写的就是「谢谢妈妈」

function hbTotal(dishId){ var n=0; (state.wishes||[]).forEach(function(w){ if(w.dishId===dishId&&w.status!=='done'&&w.hb) n+=w.hb; }); return n; }

function dishesOf(cat){ return (state.dishes||[]).filter(function(d){ return d.cat===cat; }); }

function pickIsCurrent(){ return state.pick && state.pickDate===targetDate(); }
function picHtml(d, cap){

  var img=d.image?'<img src="'+esc(d.image)+'" alt="" loading="lazy" onload="this.className=\'ok\'" onerror="this.remove()">':'';

function parseList(text){
  return String(text||'').replace(/(需要|食材|要买|买|然后|就是|还有|以及|加上|跟|和)/g,'、').split(/[、，,。；;．\s\/]+/)
    .map(function(x){ return x.trim(); }).filter(function(x,i,a){ return x && x.length<=12 && a.indexOf(x)===i; });
}
function cleanName(t){ return String(t||'').replace(/[。，,.!！?？、\s]+/g,'').replace(/^(加|加上|加一个|加个|我要|来个|来一个|想吃|吃)/,'').trim().slice(0,30); }

// ---- 网络 ----
function api(path, opts){
  opts=opts||{}; var o={method:opts.method||'GET',headers:{}};
  if(opts.json){ o.headers['Content-Type']='application/json'; o.body=JSON.stringify(opts.json); }
  if(opts.blob){ o.headers['Content-Type']=opts.blob.type||'image/jpeg'; o.body=opts.blob; }
  if(!BASE) return Promise.reject(new Error('还没配置接口地址（docs/config.js）'));
  return fetch(BASE+path,o).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok){ var err=new Error(j.error||('出错了 '+r.status)); err.status=r.status; throw err; } return j; }); });
}
function loadState(){
  var now=new Date();
  return api('/api/state?date='+today()+'&hour='+now.getHours()+'&ddate='+dinnerDate()+'&tz='+encodeURIComponent(tzName())).then(function(s){ state=s; loaded=true; lastOk=Date.now(); $('syncNote').textContent=''; render(); })
    .catch(function(){ if(!loaded) $('syncNote').textContent='连不上网，正在重试…'; else if(Date.now()-lastOk>60000) $('syncNote').textContent='网络不太好，显示的可能不是最新的'; render(); });
}
function act(p, okMsg){ return p.then(function(r){ if(okMsg) toast(okMsg); return loadState().then(function(){ return r; }); }).catch(function(e){ toast(e.message||'没成功，请再试一次'); }); }

// ---- 语音：后端 Qwen 录音识别 → 浏览器识别 → 键盘话筒 ----
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var inWeChat=/MicroMessenger/i.test(navigator.userAgent);
var canRecord=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
var recorder=null;
function voiceCapture(o){ // o: {btn, status, input, onText}
  if(state.voice&&canRecord) return recordAndTranscribe(o);
  if(SR&&!inWeChat) return browserRecognize(o);
  keyboardDictation(o,'');
}
function keyboardDictation(o,prefix){ if(o.input){ o.input.value=''; o.input.focus(); } o.status.textContent=(prefix||'')+'请点键盘上的 🎤 话筒键说，说完点旁边的按钮'; }
function setRec(o,on){ o.btn.classList.toggle('listening',on); o.btn.textContent=on?'⏹':'🎤'; }
function recordAndTranscribe(o){
  if(recorder){ if(recorder.state==='recording') recorder.stop(); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var types=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/aac'], mime=null;
    for(var i=0;i<types.length;i++){ if(window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(types[i])){ mime=types[i]; break; } }
    var rec; try{ rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream); }catch(e){ stream.getTracks().forEach(function(t){ t.stop(); }); keyboardDictation(o,'这个浏览器不能录音。'); return; }
    var chunks=[]; recorder=rec;
    rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onstop=function(){
      stream.getTracks().forEach(function(t){ t.stop(); }); recorder=null; setRec(o,false);
      var type=(rec.mimeType||mime||'audio/mp4').split(';')[0], blob=new Blob(chunks,{type:type});
      if(blob.size<1000){ o.status.textContent='没录到声音，再点一次，说久一点'; return; }
      o.status.textContent='正在听懂…';
      // 先在手机上转成 WAV 再传（识别服务对 WAV 最稳）；转不了或没成功，再把原录音传一次
      function send(b){ return api('/api/transcribe',{method:'POST',blob:b}); }
      blobToWav(blob).then(function(wav){ return send(wav).catch(function(e){ if(e&&e.status===422) throw e; return send(blob); }); }, function(){ return send(blob); }).then(function(r){ var t=String(r.text||'').trim(); if(!t){ o.status.textContent='没听清，请再说一次'; return; } o.status.textContent='听到：'+t; o.onText(t); })
        .catch(function(e){ o.status.textContent=(e&&e.message)||'识别失败，请再试一次'; });
    };
    rec.start(); setRec(o,true); o.status.textContent='正在听…说完再点一下 ⏹';
    setTimeout(function(){ if(recorder===rec&&rec.state==='recording') rec.stop(); },15000);
  }).catch(function(){ keyboardDictation(o,'没有麦克风权限。'); });

// 把录音解码后压成 16k 单声道 WAV
var sharedAC=null;
function blobToWav(blob){
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return Promise.reject(new Error('no AudioContext'));
  var read = blob.arrayBuffer ? blob.arrayBuffer() : new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){ res(fr.result); }; fr.onerror=rej; fr.readAsArrayBuffer(blob); });
  return read.then(function(buf){
    if(!sharedAC) sharedAC=new AC();
    return new Promise(function(res,rej){ var p=sharedAC.decodeAudioData(buf,res,rej); if(p&&p.then) p.then(res,rej); });
  }).then(function(ab){
    var n=ab.length, rate=ab.sampleRate, c0=ab.getChannelData(0), c1=ab.numberOfChannels>1?ab.getChannelData(1):null;
    var to=16000, step=rate/to, m=Math.floor(n/step); if(m<1600) throw new Error('too short');
    var view=new DataView(new ArrayBuffer(44+m*2));
    function w(o,str){ for(var i=0;i<str.length;i++) view.setUint8(o+i,str.charCodeAt(i)); }
    w(0,'RIFF'); view.setUint32(4,36+m*2,true); w(8,'WAVE'); w(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
    view.setUint32(24,to,true); view.setUint32(28,to*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true); w(36,'data'); view.setUint32(40,m*2,true);
    for(var i=0;i<m;i++){
      // 一段取平均，顺便当低通
      var a=Math.floor(i*step), b=Math.min(n,Math.max(a+1,Math.floor((i+1)*step))), sum=0;
      for(var k=a;k<b;k++) sum+= c1 ? (c0[k]+c1[k])/2 : c0[k];
      var x=Math.max(-1,Math.min(1,sum/(b-a)));
      view.setInt16(44+i*2, Math.round(x*32767), true);
    }
    return new Blob([view.buffer],{type:'audio/wav'});
  });

function browserRecognize(o){

// 朗读：按句子一段一段读（一口气读长句子有的手机读到一半就停）；刚 cancel 完马上 speak 有的手机不出声，所以隔一下再读；
// 两秒半还没开始出声就提示看静音键和音量。读的内容同时显示在按钮下面，听不见也能看
var zhVoiceCache=null;
function zhVoice(){ if(!('speechSynthesis' in window)) return null; var vs=speechSynthesis.getVoices()||[]; var best=null; for(var i=0;i<vs.length;i++){ var l=String(vs[i].lang||'').replace('_','-'); if(/^zh-CN/i.test(l)&&(!best||/Ting|Tingting|Li-mu|Google/i.test(vs[i].name))){ best=vs[i]; if(/Ting|Google/i.test(vs[i].name)) break; } else if(!best&&/^zh/i.test(l)) best=vs[i]; } return best; }
if('speechSynthesis' in window&&speechSynthesis.addEventListener){ try{ speechSynthesis.addEventListener('voiceschanged', function(){ zhVoiceCache=zhVoice(); }); zhVoiceCache=zhVoice(); }catch(e){} }
var speakJob=0;
function speak(text, onState){
  onState=onState||function(){};
  if(!('speechSynthesis' in window)){ onState('nosupport'); return; }
  var parts=String(text||'').split(/[。；！\n]+/).map(function(x){ return x.trim(); }).filter(Boolean);
  if(!parts.length) return;
  var job=++speakJob, i=0, started=false, wasBusy=speechSynthesis.speaking||speechSynthesis.pending;
  try{ speechSynthesis.cancel(); }catch(e){}
  function next(){
    if(job!==speakJob) return;
    if(i>=parts.length){ onState('done'); return; }
    var u=new SpeechSynthesisUtterance(parts[i++]); u.lang='zh-CN'; u.rate=0.9;
    var v=zhVoiceCache||zhVoice(); if(v) u.voice=v;
    u.onstart=function(){ started=true; onState('speaking'); };
    u.onend=function(){ setTimeout(next, 80); };
    u.onerror=function(e){ if(job!==speakJob) return; if(e&&(e.error==='interrupted'||e.error==='canceled')) return; onState('error'); };
    try{ speechSynthesis.resume(); }catch(e){}
    speechSynthesis.speak(u);
  }
  if(wasBusy) setTimeout(next, 150); else next();
  setTimeout(function(){ if(job===speakJob&&!started) onState('silent'); }, 2500);
}
function stopSpeak(){ speakJob++; try{ speechSynthesis.cancel(); }catch(e){} }

  openSheet('<h3>🔔 刚收到的通知</h3><p style="font-size:26px;line-height:1.4;font-weight:700;margin:0 0 14px">'+esc(body)+'</p><p class="note" style="text-align:left">以前的通知在「最近的动态」里都能看到</p><button type="button" class="big-btn primary" id="noticeOk" style="width:100%">知道了</button>');
  $('noticeOk').onclick=closeSheet;
}
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.addEventListener('message', function(e){ if(e.data&&e.data.type==='notice') showNotice(e.data); }); }catch(e){} }
(function(){ var m=/[#&?]n=([^&]+)/.exec(location.hash+location.search); if(m){ try{ showNotice({body:decodeURIComponent(m[1])}); }catch(e){} try{ history.replaceState(null,'',location.pathname); }catch(e){} } })();
function planByDate(date){ var ds=planDays(); for(var i=0;i<ds.length;i++) if(ds[i].date===date) return ds[i]; return null; }
function openChooser(date){ var plan=planByDate(date); chooser={date:date, sel:(plan&&plan.cook?plan.cook.dishIds.slice():[]), text:(plan&&plan.cook&&!isUnsure(plan)?plan.cook.text:'')}; renderChooser(); setTimeout(function(){ $('chooser').scrollIntoView({behavior:'smooth',block:'start'}); },50); }
function renderChooser(){
  var box=$('chooser'); if(!chooser){ box.hidden=true; return; } box.hidden=false;
  var date=chooser.date, label=nightLabel(date);
  var dinnerDishes=dishesOf('dinner');
  var wishIds=[]; var wishMeta={};
  (state.wishes||[]).forEach(function(w){ if(w.status==='done'||!PEOPLE[w.who]) return; if(wishIds.indexOf(w.dishId)<0) wishIds.push(w.dishId); var m=wishMeta[w.dishId]||(wishMeta[w.dishId]={who:[],days:0,hb:0,msg:''}); if(m.who.indexOf(PEOPLE[w.who].name)<0) m.who.push(PEOPLE[w.who].name); m.days=Math.max(m.days,daysSince(w.at)); m.hb+=w.hb||0; if(w.hb&&!m.msg) m.msg=w.hbMsg||''; });
  // 红包多的排前面，其次等得久的
  wishIds.sort(function(a,b){ return (wishMeta[b].hb-wishMeta[a].hb)||(wishMeta[b].days-wishMeta[a].days); });
  function chip(d, meta, hb, msg){ var on=chooser.sel.indexOf(d.id)>=0; return '<button type="button" data-id="'+d.id+'" class="'+(on?'on':'')+'"><span class="cn">'+esc(d.emoji||'')+' '+esc(d.name)+'</span>'+(hb?hbHtml(hb,msg):'')+(meta?'<small>'+esc(meta)+'</small>':'')+'</button>'; }
  var wishChips=wishIds.map(dishById).filter(Boolean).map(function(d){ var m=wishMeta[d.id]; return chip(d, m.who.join('、')+'想吃'+(m.days?'，等了'+m.days+'天':''), m.hb, m.msg); }).join('');
  var momChips=dinnerDishes.filter(function(d){ return d.mom && wishIds.indexOf(d.id)<0; }).map(function(d){ return chip(d, d.lastMade?'上次 '+d.lastMade.slice(5).replace('-','/'):''); }).join('');
  var otherChips=dinnerDishes.filter(function(d){ return !d.mom && wishIds.indexOf(d.id)<0; }).map(function(d){ return chip(d,''); }).join('');
  box.innerHTML='<h3>'+esc(nightFull(date))+' 做什么？点一个或几个</h3>'
    +(wishChips?'<h4>他们想吃</h4><div class="chips big">'+wishChips+'</div>':'<p class="note" style="text-align:left">心愿单是空的</p>')
    +(momChips?'<h4>拿手菜</h4><div class="chips">'+momChips+'</div>':'')
    +(otherChips?'<h4>其他</h4><div class="chips">'+otherChips+'</div>':'')
    +'<h4>别的</h4><div class="add-row"><input id="chooserInput" placeholder="说一句或打字" autocomplete="off" value="'+esc(chooser.text||'')+'"><button type="button" id="chooserVoice" class="mic">🎤</button></div><p class="note" id="chooserStatus" style="text-align:left"></p>'
    +'<div class="row" style="margin-top:12px"><button type="button" class="big-btn primary" id="chooserOk">就这么定</button><button type="button" class="big-btn danger" id="chooserNo">不做饭</button><button type="button" class="big-btn ghost" id="chooserUndo">没想好</button><button type="button" class="big-btn ghost" id="chooserCancel">取消</button></div>';
  Array.prototype.forEach.call(box.querySelectorAll('.chips button'), function(b){ b.onclick=function(){ var id=Number(b.getAttribute('data-id')), k=chooser.sel.indexOf(id); if(k>=0) chooser.sel.splice(k,1); else chooser.sel.push(id); renderChooser(); }; });
  $('chooserVoice').onclick=function(){ voiceCapture({btn:$('chooserVoice'),status:$('chooserStatus'),input:$('chooserInput'),onText:function(t){ $('chooserInput').value=cleanName(t); }}); };
  $('chooserOk').onclick=function(){
    var text=$('chooserInput').value.trim(); var sel=chooser.sel.slice();
    if(!sel.length&&!text){ toast('先点一个菜'); return; }
    var p=Promise.resolve();
    if(text){ p=api('/api/dishes',{method:'POST',json:{name:cleanName(text)||text,cat:'dinner',mom:true,by:'mom'}}).then(function(r){ if(r.dish&&sel.indexOf(r.dish.id)<0) sel.push(r.dish.id); }); }
    chooser=null;
    // 定好了顺带说一句：谁点的、等了几天、有没有红包
    var who=[], days=0, hb=0; sel.forEach(function(id){ (state.wishes||[]).forEach(function(w){ if(w.dishId===id&&w.status!=='done'&&PEOPLE[w.who]){ if(who.indexOf(PEOPLE[w.who].name)<0) who.push(PEOPLE[w.who].name); days=Math.max(days,daysSince(w.at)); hb+=w.hb||0; } }); });
    var msg = who.length ? '定好了！'+who.join('和')+'点的'+(days?'，等了 '+days+' 天':'')+(hb?'，还有红包 '+hbText(hb):'')+'，一定很开心 😊' : '定好了，大家都能看到';
    act(p.then(function(){ return api('/api/dinner/cook',{method:'POST',json:{date:date,dishIds:sel,text:''}}); }), null).then(function(r){ if(r) toast(msg, who.length?5000:2600); });
  };
  $('chooserNo').onclick=function(){ chooser=null; act(api('/api/dinner/cook',{method:'POST',json:{date:date,dishIds:[],text:NO_COOK}}),'好，'+label+'不做饭'); };
  $('chooserUndo').onclick=function(){ chooser=null; act(api('/api/dinner/cook',{method:'POST',json:{date:date,dishIds:[],text:UNSURE}}),label+'先不定，大家会看到你还没想好'); };
  $('chooserCancel').onclick=function(){ chooser=null; renderChooser(); };
}
// 下午 1 点以后先关心晚饭：页面顺序和朗读顺序都跟着这个
function dinnerFirst(){ return new Date().getHours()>=13; }
var speakingNow=false;
function speakBtn(label){ $('btnSpeak').textContent=label; }
$('btnSpeak').onclick=function(){
  if(speakingNow){ stopSpeak(); speakingNow=false; speakBtn('🔊 读给我听'); return; }
  var text=dinnerFirst() ? dinnerSpeak+'。'+speakText : speakText+'。'+dinnerSpeak;
  var box=$('speakBox'); box.hidden=false; box.innerHTML='<div class="lab">读的是：</div>'+esc(text.replace(/。+/g,'。'))+'<p class="note" id="speakNote" style="text-align:left;margin:8px 0 0"></p>';
  speakingNow=true; speakBtn('⏹ 正在读…点一下停');
  speak(text, function(st){
    var n=$('speakNote'); if(!n) return;
    if(st==='speaking') n.textContent='';
    else if(st==='done'){ speakingNow=false; speakBtn('🔊 读给我听'); }
    else if(st==='silent') n.textContent='没听到声音？看看手机侧面的静音键和音量。上面的字就是要读的内容';
    else if(st==='error'){ speakingNow=false; speakBtn('🔊 读给我听'); n.textContent='这个手机朗读出错了。上面的字就是要读的内容'; }
    else if(st==='nosupport'){ speakingNow=false; speakBtn('🔊 读给我听'); n.textContent='这个手机不能朗读，上面的字就是内容'; }
  });
};

// 点菜（女儿 / 小陈）
function renderOrder(){
  if(MEMBERS.indexOf(role)<0) return;
  var days=shownDays();
  renderMyHb();
  // 近三天都能说：回来吃 / 不回来 / 没想好；更远的折在「再往后几天」里
  moreDaysBtn($('foldMoreDays'));
  $('homeRows').innerHTML=days.map(function(p){
    var r=p.replies?p.replies[role]:null, v=r?(r.home===true?'1':r.home===false?'0':'x'):'';
    function b(val,cls,txt){ return '<button type="button" class="'+cls+(v===val?' on':'')+'" data-date="'+p.date+'" data-home="'+val+'">'+txt+'</button>'; }

  $('momSaid').innerHTML='<h3>妈妈说</h3>'+days.map(function(p,i){ var c=cookNames(p); return '<div style="font-size:'+(i?22:30)+'px;font-weight:'+(i?400:800)+';'+(i?'color:var(--muted);margin-top:6px':'')+'">'+esc(nightFull(p.date))+'：'+(c?esc(c)+(p.done?' <span style="color:var(--good);font-size:20px">✓ 做好了</span>':''):'<span style="color:var(--muted);font-weight:400;font-size:22px">'+(isUnsure(p)?'妈妈还没想好':'还没定')+'</span>')+'</div>'; }).join('');

  var mine={}; openWishesOf(role).forEach(function(w){ mine[w.dishId]=w; });
  var list=dishesOf('dinner').slice().sort(function(a,b){ return (hbTotal(b.id)-hbTotal(a.id)) || ((b.mom?1:0)-(a.mom?1:0)); });
  var grid=$('orderGrid');
  if(!loaded) grid.innerHTML='<div class="empty">正在打开…</div>';
  else if(!list.length) grid.innerHTML='<div class="empty">菜单里还没有正餐，先在下面说一道想吃的</div>';
  else grid.innerHTML=list.map(function(d){ var w=mine[d.id], hb=hbTotal(d.id); var meta=w&&w.status==='planned'&&w.plannedFor?'妈妈安排在'+nightLabel(w.plannedFor):(d.mom?'⭐ 妈妈的拿手菜':''); return '<button type="button" class="card'+(w?' selected':'')+'" data-id="'+d.id+'" aria-pressed="'+(w?'true':'false')+'">'+picHtml(d)+'<div class="name">'+esc(d.name)+'</div>'+(w?'<div class="tick">✓ 已点</div>':'')+(hb?'<div class="meta">'+hbHtml(hb,hbMsgOf(d.id))+'</div>':'')+(meta?'<div class="meta">'+esc(meta)+'</div>':'')+'</button>'; }).join('');
  Array.prototype.forEach.call(grid.querySelectorAll('.card'), function(el){ el.onclick=function(){ var id=Number(el.getAttribute('data-id')), w=mine[id], d=dishById(id); if(w) act(api('/api/wishes/'+w.id+'/remove',{method:'POST'}),'取消了'); else orderWish({who:role,dishId:id}, d?d.name:''); }; });
  // 心愿单：没做的在前，红包多的在前
  var ws=(state.wishes||[]).filter(function(w){ return PEOPLE[w.who]&&dishById(w.dishId); }).sort(function(a,b){ return ((a.status==='done'?1:0)-(b.status==='done'?1:0)) || ((b.hb||0)-(a.hb||0)) || (a.at<b.at?1:-1); });
  $('wishList').innerHTML=ws.length?ws.map(function(w){ var d=dishById(w.dishId), me=w.who===role, done=w.status==='done';
    var st=done?'做过了 '+(w.doneAt?weekday(w.doneAt):''):w.status==='planned'?'妈妈安排在'+nightLabel(w.plannedFor||''):'等妈妈安排'+(daysSince(w.at)?'，等了'+daysSince(w.at)+'天':'');
    var btns='';
    if(me&&!done) btns='<button type="button" class="x red" data-hb="'+w.id+'">'+(w.hb?'改红包':'🧧 包红包')+'</button><button type="button" class="x" data-wid="'+w.id+'">取消</button>';
    else if(me&&done&&w.hb&&!w.hbPaid) btns='<button type="button" class="x go" data-paid="'+w.id+'">红包发了 ✓</button>';
    return '<div class="wish'+(done&&!(me&&w.hb&&!w.hbPaid)?' done':'')+'"><span class="n">'+dishLink(d)+(w.hb?' '+hbHtml(w.hb,w.hbMsg):'')+(me&&done&&w.hb&&!w.hbPaid?'<small>妈妈做了，记得在微信给妈妈发红包</small>':done&&w.hb&&w.hbPaid?'<small>红包已发</small>':'')+'</span><span class="w">'+av(w.who)+' '+esc(PEOPLE[w.who].name)+' · '+st+'</span>'+btns+'</div>'; }).join('')

    else if(b.getAttribute('data-paid')) act(api('/api/wishes/'+b.getAttribute('data-paid')+'/update',{method:'POST',json:{hbPaid:true}}),'好，妈妈会看到');
    else act(api('/api/wishes/'+b.getAttribute('data-wid')+'/remove',{method:'POST'}),'取消了');
  }; });
}
// 点一道菜。点好了顺手问一句要不要给妈妈包个红包（按家里人的意见：点菜时就问，不用再跑去心愿单）
function orderWish(json, name){
  return api('/api/wishes',{method:'POST',json:json}).then(function(r){
    toast('点好了'+(name?'：'+name:'')+'，妈妈会看到');
    return loadState().then(function(){
      var did=r.dish&&r.dish.id, mine=(r.wishes||[]).filter(function(w){ return w.who===role&&w.status!=='done'&&(!did||w.dishId===did); });
      if(mine.length&&!mine[mine.length-1].hb) openHb(mine[mine.length-1].id, true);
      return r;
    });
  }).catch(function(e){ toast(e.message||'没成功，请再试一次'); });
}
// 菜名做成能点的样子；点了去「菜谱本」把这道菜展开：看食材、照片，食材旁边点「买」就进菜篮子
function dishLink(d, noEmoji){ return '<button type="button" class="dlink" data-dish="'+d.id+'">'+(noEmoji?'':esc(d.emoji||'')+' ')+esc(d.name)+'<span class="go">›</span></button>'; }
function openDish(id){
  var d=dishById(id); if(!d) return;
  if(menuFold[d.cat]){ menuFold[d.cat]=false; store('bf_fold_'+d.cat, null); }
  expandedId=id; pendingDelete=null;
  showView('recipes'); renderRecipes();
  // 顶上的页签是悬浮的，滚的时候让开它，菜名才不会被挡住
  setTimeout(function(){ var li=document.querySelector('#view-recipes li[data-id="'+id+'"]'); if(!li) return; var nav=$('nav'), off=(nav?nav.getBoundingClientRect().height:0)+12; window.scrollTo({top:Math.max(0, li.getBoundingClientRect().top+window.pageYOffset-off), behavior:'smooth'}); },60);
  toast('这是「'+d.name+'」：点食材旁边的「买」就进菜篮子', 3500);
}
function wishById(id){ var l=state.wishes||[]; for(var i=0;i<l.length;i++) if(l[i].id===id) return l[i]; return null; }
function openHb(wishId, justOrdered){
  var w=wishById(wishId); if(!w) return; var d=dishById(w.dishId);
  var sel={n:w.hb||0, m:w.hbMsg||HB_MSGS[0]}, ownN=sel.n&&HB_AMOUNTS.indexOf(sel.n)<0, ownM=HB_MSGS.indexOf(sel.m)<0;
  openSheet('<h3>'+(justOrdered?'✓ 点好了：'+esc(d?d.name:'')+'<br>🧧 顺手给妈妈包个红包？':'🧧 给妈妈包个红包？')+'</h3><p class="hint" style="text-align:left;margin:0 0 4px">'+(justOrdered?'鼓励妈妈做这道菜，做好了谢谢她。不包也没关系':esc(d?d.name:'这道菜')+'：鼓励妈妈做这道菜，做好了谢谢她')+'</p>'
    +'<h4 class="hbh">包多少</h4><div class="chips big" id="hbAmts">'+HB_AMOUNTS.map(function(a){ return '<button type="button" data-a="'+a+'" class="'+(sel.n===a?'on':'')+'">'+hbText(a)+'</button>'; }).join('')+'</div>'
    +'<div class="add-row" style="margin-top:10px"><input id="hbInput" type="number" inputmode="numeric" min="1" max="9999" placeholder="别的金额" value="'+(ownN?sel.n:'')+'"></div>'
    +'<h4 class="hbh">跟妈妈说句话</h4><div class="chips" id="hbMsgs">'+HB_MSGS.map(function(x){ return '<button type="button" data-m="'+esc(x)+'" class="'+(!ownM&&sel.m===x?'on':'')+'">'+esc(x)+'</button>'; }).join('')+'</div>'
    +'<div class="add-row" style="margin-top:10px"><input id="hbMsgInput" maxlength="20" placeholder="或者自己写一句" autocomplete="off" value="'+(ownM?esc(sel.m):'')+'"></div>'
    +'<p class="note" style="text-align:left">这里只是记一笔，钱要自己在微信里发给妈妈。包好了妈妈那边会看到这句话</p>'
    +'<button type="button" class="big-btn primary" id="hbOk" style="width:100%">包好了</button>'
    +'<button type="button" class="big-btn ghost" id="hbNone" style="width:100%;margin-top:8px">'+(w.hb?'不包了':'这次不用')+'</button>');
  function mark(boxId, attr, val){ Array.prototype.forEach.call($(boxId).querySelectorAll('button'), function(b){ b.classList.toggle('on', b.getAttribute(attr)===String(val)); }); }
  Array.prototype.forEach.call($('hbAmts').querySelectorAll('button'), function(b){ b.onclick=function(){ sel.n=Number(b.getAttribute('data-a')); $('hbInput').value=''; mark('hbAmts','data-a',sel.n); }; });
  Array.prototype.forEach.call($('hbMsgs').querySelectorAll('button'), function(b){ b.onclick=function(){ sel.m=b.getAttribute('data-m'); $('hbMsgInput').value=''; mark('hbMsgs','data-m',sel.m); }; });
  $('hbInput').oninput=function(){ mark('hbAmts','data-a',''); };
  $('hbMsgInput').oninput=function(){ mark('hbMsgs','data-m',''); };
  $('hbOk').onclick=function(){
    var own=Math.round(Number($('hbInput').value)), n=own>0?Math.min(own,9999):sel.n, m=$('hbMsgInput').value.trim().slice(0,20)||sel.m;
    if(!(n>0)){ toast('先选包多少'); return; }
    closeSheet(); act(api('/api/wishes/'+wishId+'/update',{method:'POST',json:{hb:n,hbMsg:m}}), '红包记上了 '+hbText(n)+' '+m);
  };
  $('hbNone').onclick=function(){ closeSheet(); if(!w.hb) return; act(api('/api/wishes/'+wishId+'/update',{method:'POST',json:{hb:0}}),'红包取消了'); };
}

// AI 推荐新菜（点菜页：直接点；菜单页：加进菜单）
var suggestions={order:[],menu:[]}, sugFold={order:false,menu:false};
function loadSuggest(where, cat){
  var st=$(where+'SuggestStatus'); st.textContent='AI 正在想…';
  api('/api/suggest',{method:'POST',json:{cat:cat}}).then(function(r){ sugFold[where]=false; suggestions[where]=(r.items||[]).map(function(x){ return {name:x.name,ingredients:x.ingredients||[],cat:cat}; }); st.textContent=suggestions[where].length?'':'AI 没想出新的，再点一次'; renderSuggest(where); })
    .catch(function(e){ st.textContent=e.message||'AI 出错了，请再试一次'; });
}
function renderSuggest(where){
  var box=$(where+'Suggest'), l=suggestions[where], f=sugFold[where];
  if(!l.length){ box.innerHTML=''; return; }
  // 推荐的结果可以折起来，也可以一道一道删，或者全部清掉
  box.innerHTML='<div class="sughead"><button type="button" class="secfold" data-act="fold"><span class="arr">'+(f?'▶':'▼')+'</span>AI 推荐 <small>'+l.length+' 道'+(f?'，点开看':'')+'</small></button><button type="button" class="big-btn ghost sm" data-act="clear">全部清掉</button></div>'
    +(f?'':l.map(function(x,i){ return '<div class="wish"><span class="n">'+esc(x.name)+(x.ingredients.length?'<small>'+esc(x.ingredients.slice(0,6).join('、'))+'</small>':'')+'</span><button type="button" class="x go" data-i="'+i+'">'+(where==='order'?'想吃':'加进菜单')+'</button><button type="button" class="x" data-rm="'+i+'" aria-label="不要这道">✕ 不要</button></div>'; }).join(''));
  Array.prototype.forEach.call(box.querySelectorAll('button'), function(b){ b.onclick=function(){
    var a=b.getAttribute('data-act');
    if(a==='fold'){ sugFold[where]=!sugFold[where]; renderSuggest(where); return; }
    if(a==='clear'){ suggestions[where]=[]; $(where+'SuggestStatus').textContent=''; renderSuggest(where); return; }
    if(b.getAttribute('data-rm')!=null){ l.splice(Number(b.getAttribute('data-rm')),1); renderSuggest(where); return; }
    var x=l.splice(Number(b.getAttribute('data-i')),1)[0]; renderSuggest(where); if(!x) return;
    var p=api('/api/dishes',{method:'POST',json:{name:x.name,cat:x.cat,ingredients:x.ingredients,mom:false,by:role}});
    if(where==='order') p.then(function(r){ return orderWish({who:role,dishId:r.dish.id}, x.name); }).catch(function(e){ toast(e.message||'没成功，请再试一次'); });
    else act(p,'加进菜单了：'+x.name);
  }; });
}

// 拖动排序：按住 ☰ 上下拖。只挪别的菜、不挪手指按着的那一行，手机上拖得才稳
var dragState=null;
function listIds(list){ return Array.prototype.filter.call(list.children, function(x){ return x.getAttribute('data-id'); }).map(function(x){ return Number(x.getAttribute('data-id')); }); }
function sibLi(el, dir){ var s=dir<0?el.previousElementSibling:el.nextElementSibling; while(s&&!s.getAttribute('data-id')) s=dir<0?s.previousElementSibling:s.nextElementSibling; return s; }
function startDrag(e, li, list, cat){
  if(dragState||(e.button!=null&&e.button>0)) return;
  e.preventDefault();
  dragState={li:li, list:list, cat:cat, before:listIds(list), pid:e.pointerId};
  li.classList.add('dragging');
  document.addEventListener('pointermove', onDragMove, {passive:false});
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
}
function onDragMove(e){
  var ds=dragState; if(!ds||e.pointerId!==ds.pid) return;
  e.preventDefault();
  var y=e.clientY;
  for(var guard=0; guard<60; guard++){
    var p=sibLi(ds.li,-1), n=sibLi(ds.li,1), r;
    if(p){ r=p.getBoundingClientRect(); if(y<r.top+r.height/2){ ds.list.insertBefore(p, ds.li.nextSibling); continue; } }
    if(n){ r=n.getBoundingClientRect(); if(y>r.top+r.height/2){ ds.list.insertBefore(n, ds.li); continue; } }
    break;
  }
  // 拖到屏幕上下边就自动滚
  if(y<140) window.scrollBy(0,-14); else if(y>window.innerHeight-90) window.scrollBy(0,14);
}
function endDrag(e){
  var ds=dragState; if(!ds||(e&&e.pointerId!==ds.pid)) return;
  dragState=null; ds.li.classList.remove('dragging');
  document.removeEventListener('pointermove', onDragMove, {passive:false});
  document.removeEventListener('pointerup', endDrag);
  document.removeEventListener('pointercancel', endDrag);
  var after=listIds(ds.list);
  if(after.join()!==ds.before.join()) act(api('/api/dishes/reorder',{method:'POST',json:{cat:ds.cat,ids:after}}),'顺序记住了');
  else if(renderPending) render();
}

function shrink(file){
  return new Promise(function(res){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){ var s=Math.min(1,1200/Math.max(img.width,img.height)); var c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(function(b){ res(b||file); },'image/jpeg',0.85); };
    img.onerror=function(){ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}
function shrinkSquare(file, size){
  return new Promise(function(res){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){ var m=Math.min(img.width,img.height), c=document.createElement('canvas'); c.width=c.height=size; c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size); URL.revokeObjectURL(url); c.toBlob(function(b){ res(b||file); },'image/jpeg',0.85); };
    img.onerror=function(){ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}

// ---- 手机通知：妈妈收家里人的动态（不回来吃、点菜、选早饭、红包）；女儿小陈收提醒（晚上选早饭、早上说回不回来）和妈妈定的菜 ----
function pushWhat(){ return role==='mom'?'有人说不回来吃、点菜、选好早饭、包红包时':'晚上没选早饭、早上没说回不回来吃时，妈妈定了做什么、做好了时'; }
function pushExample(){ return role==='mom'?'「女儿：点了 红烧肉（🧧'+HB_UNIT+'20 谢谢妈妈）」「小陈：周三晚上不回来吃」':'「今晚回来吃吗？告诉妈妈一下」「妈妈：周三晚上做 红烧肉」'; }
var pushHere=null;   // 这台手机：true 已打开 / false 没打开 / null 还不知道
function b64uToBytes(s){ var t=s.replace(/-/g,'+').replace(/_/g,'/'); t+='==='.slice((t.length+3)%4); var bin=atob(t), out=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
function bytesToB64u(buf){ var b=new Uint8Array(buf), s=''; for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function pushSupport(){
  if(inWeChat) return 'wechat';
  var ios=/iP(hone|ad|od)/.test(navigator.userAgent), home=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)) return ios&&!home?'need-home':'no';
  if(Notification.permission==='denied') return 'denied';
  return 'ok';
}
function pushNote(){
  var s=pushSupport();
  if(s==='wechat') return '微信里收不到通知。点右上角「…」→「在浏览器打开」，再加到主屏幕';
  if(s==='need-home') return 'iPhone 要先把「吃什么」加到主屏幕（Safari 底部「分享」→「添加到主屏幕」），从桌面图标打开，才能收通知';
  if(s==='no') return '这个浏览器收不了通知，换 Chrome 或 Safari 试试';
  if(s==='denied') return '通知被关掉了。要在手机的「设置」里找到「吃什么」（或浏览器），允许通知';
  if(pushHere) return '已经打开了：'+pushWhat()+'，手机会提醒你';
  return '打开以后，'+pushWhat()+'，手机会响一下提醒你打开看';
}
function checkPushHere(){
  if(!role||pushSupport()!=='ok'||!state.pushKey) return;
  navigator.serviceWorker.getRegistration().then(function(reg){ return reg?reg.pushManager.getSubscription():null; }).then(function(sub){
    var on=!!(sub&&sub.options&&sub.options.applicationServerKey&&bytesToB64u(sub.options.applicationServerKey)===state.pushKey);
    if(on!==pushHere){ pushHere=on; renderPushCard(); }
  }).catch(function(){});
}
function enablePush(){
  // 先要权限（必须在点按钮的这一下里要），再订阅，再告诉后端，最后发一条试试
  if(!state.pushKey){ toast('还没连上，稍等再点'); return Promise.resolve(); }
  var perm=Notification.requestPermission();
  return Promise.resolve(perm).then(function(p){
    if(p!=='granted') throw new Error(p==='denied'?'没有允许通知。要在手机设置里允许「吃什么」发通知':'还没允许通知');
    return navigator.serviceWorker.register('sw.js').then(function(){ return navigator.serviceWorker.ready; });
  }).then(function(reg){
    return reg.pushManager.getSubscription().then(function(old){
      if(old&&!(old.options&&old.options.applicationServerKey&&bytesToB64u(old.options.applicationServerKey)===state.pushKey)) return old.unsubscribe().then(function(){ return null; });
      return old;
    }).then(function(old){ return old||reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64uToBytes(state.pushKey)}); });
  }).then(function(sub){ return api('/api/push/subscribe',{method:'POST',json:{who:role,key:state.pushKey,sub:sub.toJSON()}}); })
    .then(function(){ pushHere=true; store('bf_push_later_'+role,null); renderPushCard(); toast('通知打开了，马上会收到一条试试'); return api('/api/push/test',{method:'POST',json:{who:role}}).catch(function(){}); })
    .catch(function(e){ var m=(e&&e.message)||''; toast(/[\u4e00-\u9fff]/.test(m)?m:'通知没打开成功，请再试一次'+(m?'（'+m+'）':'')); });
}
function disablePush(){
  return navigator.serviceWorker.getRegistration().then(function(reg){ return reg?reg.pushManager.getSubscription():null; }).then(function(sub){
    if(!sub) return; var ep=sub.endpoint; return sub.unsubscribe().then(function(){ return api('/api/push/unsubscribe',{method:'POST',json:{who:role,endpoint:ep}}); });
  }).then(function(){ pushHere=false; renderPushCard(); toast('通知关掉了'); }).catch(function(){ toast('没关掉，请再试一次'); });
}
// 页面顶上的提示卡（妈妈在小饭桌，女儿小陈在点个菜）：这台手机还没打开通知时显示，可以「以后再说」
function renderPushCard(){
  var c=$(role==='mom'?'pushCard':'pushCardOrder'), other=$(role==='mom'?'pushCardOrder':'pushCard'); if(other) other.hidden=true; if(!c) return;
  var s=role?pushSupport():'';
  if(!role||pushHere!==false&&s==='ok'||pushHere||load('bf_push_later_'+role)==='1'||s==='no'||!loaded){ c.hidden=true; if(role&&pushHere===null) checkPushHere(); return; }
  c.hidden=false;
  c.innerHTML='<h3>🔔 打开手机'+(role==='mom'?'通知':'提醒')+'？</h3><p>'+esc(pushNote())+'</p><div class="row">'+(s==='ok'?'<button type="button" class="big-btn primary" id="pushOn">打开'+(role==='mom'?'通知':'提醒')+'</button>':'')+'<button type="button" class="big-btn ghost" id="pushLater">以后再说</button></div>';
  if($('pushOn')) $('pushOn').onclick=function(){ enablePush(); };
  $('pushLater').onclick=function(){ store('bf_push_later_'+role,'1'); renderPushCard(); toast('想打开时，点右上角头像'); };
}
function drawPushSheet(){
  var box=$('pushSheetBtns'); if(!box) return; var s=pushSupport();
  $('pushSheetNote').textContent=pushNote();
  box.innerHTML=s!=='ok'?'':pushHere?'<button type="button" class="big-btn" id="pushTest">发一条试试</button><button type="button" class="big-btn ghost" id="pushOff">关掉通知</button>':'<button type="button" class="big-btn primary" id="pushOn2">打开通知</button>';
  if($('pushOn2')) $('pushOn2').onclick=function(){ enablePush().then(drawPushSheet); };
  if($('pushTest')) $('pushTest').onclick=function(){ api('/api/push/test',{method:'POST',json:{who:role}}).then(function(r){ toast(r.ok?'发出去了，看看手机':'没发出去，关掉再打开试试'); }).catch(function(e){ toast(e.message||'没发出去'); }); };
  if($('pushOff')) $('pushOff').onclick=function(){ disablePush().then(drawPushSheet); };
}

$('btnProfile').onclick=function(){ openProfile(false); };
$('btnFeedback').onclick=function(){ openProfile(true); };
var saved=load('bf_role');
if(PEOPLE[saved]) applyRole(saved); else { $('who').hidden=false; renderWho(); }

loadState();
setInterval(loadState, 10000);
// 网页有新版本就自己刷新一次（GitHub Pages 和手机都会缓存旧页面）
var verReloaded=false;
function checkVersion(){
  fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.text():''; }).then(function(v){
    v=(v||'').trim(); if(!v||v.length>40) return;
    var old=load('bf_ver');
    if(old===v) return;
    store('bf_ver', v);
    if(!old||verReloaded||uiBusy()) return;   // 第一次只记下来；正在打字就别刷
    verReloaded=true;
    Promise.all([fetch('index.html',{cache:'reload'}),fetch('config.js',{cache:'reload'})]).catch(function(){}).then(function(){ location.reload(); });
  }).catch(function(){});
}
checkVersion();
setInterval(checkVersion, 5*60000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) checkVersion(); });
document.addEventListener('visibilitychange', function(){ if(!document.hidden) loadState(); });
window.addEventListener('online', loadState);
setInterval(render, 60000);
})();
</script>
</body>
</html>
